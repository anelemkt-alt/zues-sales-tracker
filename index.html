document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

or:pointer\">Request an account<\u002Fspan><\u002Fdiv>\n\n        <sc-if value=\"{{ hasGoogleClientId }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;align-items:center;gap:10px;margin:16px 0\"><div style=\"flex:1;height:1px;background:oklch(90% 0.01 258)\"><\u002Fdiv><div style=\"font-size:11px;color:oklch(58% 0.02 258)\">or<\u002Fdiv><div style=\"flex:1;height:1px;background:oklch(90% 0.01 258)\"><\u002Fdiv><\u002Fdiv>\n          <div ref=\"{{ googleButtonRef }}\" style=\"display:flex;justify-content:center\"><\u002Fdiv>\n        <\u002Fsc-if>\n\n        <div style=\"margin-top:20px;padding-top:16px;border-top:1px solid oklch(93% 0.01 258);font-size:11.5px;color:oklch(55% 0.02 258)\">\n          Ask your manager for your username and password.\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isSignupMode }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"font-size:13px;color:oklch(50% 0.02 258);margin-bottom:16px\">Request a rep account — your manager will review and approve it before you can sign in.<\u002Fdiv>\n        <div style=\"margin-bottom:12px\">\n          <div style=\"font-size:12px;font-weight:600;color:oklch(45% 0.02 258);margin-bottom:5px\">Full name<\u002Fdiv>\n          <input value=\"{{ signupName }}\" sc-camel-on-change=\"{{ onSignupNameChange }}\" placeholder=\"e.g. Naledi Mabaso\" style=\"width:100%;padding:10px 12px;border:1px solid oklch(88% 0.01 258);border-radius:8px;font-size:14px\">\n        <\u002Fdiv>\n        <div style=\"margin-bottom:12px\">\n          <div style=\"font-size:12px;font-weight:600;color:oklch(45% 0.02 258);margin-bottom:5px\">Username<\u002Fdiv>\n          <input value=\"{{ signupUsername }}\" sc-camel-on-change=\"{{ onSignupUsernameChange }}\" placeholder=\"e.g. naledi\" style=\"width:100%;padding:10px 12px;border:1px solid oklch(88% 0.01 258);border-radius:8px;font-size:14px\">\n        <\u002Fdiv>\n        <div style=\"margin-bottom:12px\">\n          <div style=\"font-size:12px;font-weight:600;color:oklch(45% 0.02 258);margin-bottom:5px\">Email<\u002Fdiv>\n          <input value=\"{{ signupEmail }}\" sc-camel-on-change=\"{{ onSignupEmailChange }}\" placeholder=\"e.g. naledi@zues.com\" style=\"width:100%;padding:10px 12px;border:1px solid oklch(88% 0.01 258);border-radius:8px;font-size:14px\">\n        <\u002Fdiv>\n        <div style=\"margin-bottom:8px\">\n          <div style=\"font-size:12px;font-weight:600;color:oklch(45% 0.02 258);margin-bottom:5px\">Password<\u002Fdiv>\n          <input type=\"password\" value=\"{{ signupPassword }}\" sc-camel-on-change=\"{{ onSignupPasswordChange }}\" placeholder=\"••••••••\" style=\"width:100%;padding:10px 12px;border:1px solid oklch(88% 0.01 258);border-radius:8px;font-size:14px\">\n          <div style=\"font-size:11.5px;color:oklch(55% 0.02 258);margin-top:5px\">At least 8 characters, with letters and numbers.<\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ signupError }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"font-size:12.5px;color:oklch(52% 0.15 25);margin-bottom:10px\">{{ signupError }}<\u002Fdiv>\n        <\u002Fsc-if>\n        <div sc-camel-on-click=\"{{ handleSignup }}\" style=\"margin-top:8px;background:oklch(50% 0.16 258);color:#fff;text-align:center;padding:11px;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;margin-bottom:12px\">Request account<\u002Fdiv>\n        <div sc-camel-on-click=\"{{ backToSignIn }}\" style=\"text-align:center;font-size:12.5px;font-weight:600;color:oklch(45% 0.02 258);cursor:pointer\">Back to sign in<\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isForgotMode }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"font-size:13px;color:oklch(50% 0.02 258);margin-bottom:16px\">Enter your username or email and we'll send a password reset link.<\u002Fdiv>\n        <div style=\"margin-bottom:14px\">\n          <div style=\"font-size:12px;font-weight:600;color:oklch(4 div><\u002Fdiv>\n              <div style=\"width:40px;flex:none;font-size:12.5px;font-weight:700;text-align:right\">{{ r.conversionLabel }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isRules }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"background:#fff;border:1px solid oklch(90% 0.01 258);border-radius:10px;padding:20px;max-width:640px\">\n        <div style=\"font-size:13px;color:oklch(50% 0.02 258);margin-bottom:16px\">New leads set to \"Auto-assign\" follow these rules per school. Round robin cycles evenly through all reps.<\u002Fdiv>\n        <input value=\"{{ schoolSearch }}\" sc-camel-on-change=\"{{ onSchoolSearchChange }}\" placeholder=\"Search schools…\" style=\"width:100%;padding:9px 12px;border:1px solid oklch(88% 0.01 258);border-radius:8px;font-size:13.5px;margin-bottom:14px\">\n        <sc-if value=\"{{ showBulkSchoolBar }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;align-items:center;gap:10px;background:oklch(94% 0.03 258);border-radius:8px;padding:10px;margin-bottom:10px;flex-wrap:wrap\">\n            <div style=\"font-size:12.5px;font-weight:600;color:oklch(35% 0.1 258)\">{{ selectedSchoolCount }} selected<\u002Fdiv>\n            <sc-raw-select value=\"{{ bulkSchoolAssignTarget }}\" sc-camel-on-change=\"{{ onBulkSchoolAssignTargetChange }}\" style=\"padding:7px 10px;border:1px solid oklch(85% 0.02 258);border-radius:7px;font-size:12.5px;background:#fff\">\n              <option value=\"\">Assign to…<\u002Foption>\n              <sc-for list=\"{{ assignmentRuleOptions }}\" as=\"o\" hint-placeholder-count=\"5\"><option value=\"{{ o.value }}\">{{ o.label }}<\u002Foption><\u002Fsc-for>\n            <\u002Fsc-raw-select>\n            <div sc-camel-on-click=\"{{ onApplyBulkSchoolAssign }}\" style=\"background:oklch(50% 0.16 258);color:#fff;font-size:12.5px;font-weight:600;padding:7px 14px;border-radius:7px;cursor:pointer\">Apply<\u002Fdiv>\n            <div sc-camel-on-click=\"{{ onClearSchoolSelection }}\" style=\"font-size:12.5px;font-weight:600;color:oklch(45% 0.02 258);cursor:pointer;margin-left:auto\">Clear<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <div style=\"display:grid;grid-template-columns:0.3fr 1fr 1fr;gap:8px;font-size:11.5px;font-weight:700;color:oklch(48% 0.02 258);text-transform:uppercase;padding:0 4px 8px;align-items:center\">\n          <input type=\"checkbox\" checked=\"{{ allPageSchoolsSelected }}\" sc-camel-on-change=\"{{ onToggleSelectAllSchoolsOnPage }}\" style=\"width:15px;height:15px;cursor:pointer\">\n          <div>School<\u002Fdiv><div>Assign to<\u002Fdiv>\n        <\u002Fdiv>\n        <sc-for list=\"{{ assignmentRows }}\" as=\"row\" hint-placeholder-count=\"7\">\n          <div style=\"display:grid;grid-template-columns:0.3fr 1fr 1fr;gap:8px;padding:10px 4px;border-top:1px solid oklch(94% 0.01 258);align-items:center\">\n            <input type=\"checkbox\" checked=\"{{ row.isSelected }}\" sc-camel-on-change=\"{{ row.onToggleSelect }}\" style=\"width:15px;height:15px;cursor:pointer\">\n            <div style=\"font-size:13.5px;font-weight:600\">{{ row.source }}<\u002Fdiv>\n            <sc-raw-select value=\"{{ row.value }}\" sc-camel-on-change=\"{{ row.onChange }}\" style=\"padding:8px 10px;border:1px solid oklch(88% 0.01 258);border-radius:7px;font-size:13px;background:#fff\">\n              <sc-for list=\"{{ assignmentRuleOptions }}\" as=\"o\" hint-placeholder-count=\"5\"><option value=\"{{ o.value }}\">{{ o.label }}<\u002Foption><\u002Fsc-for>\n            <\u002Fsc-raw-select>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <sc-if value=\"{{ assignmentRowsEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:16px 4px;font-size:12.5px;color:oklch(55% 0.02 258)\">No schools yet — add leads or import a CSV, then assign each school to a rep here.<\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ showSchoolsPagination }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;justify-content:space-between;align-items:center;margin-top:12px\">\n            <div style=\"font-size:12px;color:oklch(52% 0.02 258)\">{{ schoolsPageInfo }}<\u002Fdiv>\n            <div style=\"display:flex;gap:8px\">\n              <div sc-camel-on-click=\"{{ onPrevSchoolsPage }}\" style=\"font-size:12.5px;font-weight:600;padding:7px 14px;border-radius:7px;cursor:pointer;background:#fff;border:1px solid oklch(88% 0.01 258);color:oklch(38% 0.02 258)\">Previous<\u002Fdiv>\n              <div sc-camel-on-click=\"{{ onNextSchoolsPage }}\" style=\"font-size:12.5px;font-weight:600;padding:7px 14px;border-radius:7px;cursor:pointer;background:#fff;border:1px solid oklch(88% 0.01 258);color:oklch(38% 0.02 258)\">Next<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ hasPendingSchoolRequests }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"font-size:13.5px;font-weight:700;margin:18px 0 10px\">Pending School Requests<\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid oklch(90% 0.01 258);border-radius:10px;overflow:hidden\">\n          <sc-for list=\"{{ pendingSchoolRequests }}\" as=\"req\" hint-placeholder-count=\"2\">\n            <div style=\"display:flex;align-items:center;gap:10px;padding:12px 16px;border-top:1px solid oklch(94% 0.01 258)\">\n              <div style=\"flex:1\">\n                <div style=\"font-size:13.5px;font-weight:600\">{{ req.school }}<\u002Fdiv>\n                <div style=\"font-size:11.5px;color:oklch(52% 0.02 258)\">Requested by {{ req.repName }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div sc-camel-on-click=\"{{ req.onApprove }}\" style=\"font-size:12.5px;font-weight:600;color:#fff;background:oklch(50% 0.16 258);padding:7px 12px;border-radius:7px;cursor:pointer\">Approve<\u002Fdiv>\n              <div sc-camel-on-click=\"{{ req.onReject }}\" style=\"font-size:12.5px;font-weight:600;color:oklch(52% 0.15 25);cursor:pointer\">Reject<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isDuplicates }}\" hint-placeholder-val=\"{{ false }}\">\n      <sc-if value=\"{{ duplicateGroupsEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"padding:50px;text-align:center;color:oklch(55% 0.02 258);font-size:13.5px;background:#fff;border:1px solid oklch(90% 0.01 258);border-radius:10px\">No duplicate leads found.<\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-for list=\"{{ duplicateGroups }}\" as=\"grp\" hint-placeholder-count=\"2\">\n        <div style=\"background:#fff;border:1px solid oklch(90% 0.01 258);border-radius:10px;padding:16px;margin-bottom:14px\">\n          <div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:12px\">\n            <div style=\"font-size:12px;font-weight:700;color:oklch(48% 0.02 258);text-transform:uppercase\">Possible duplicate — {{ grp.leads.length }} matching records<\u002Fdiv>\n            <div sc-camel-on-click=\"{{ grp.onKeepMostActive }}\" style=\"font-size:12px;font-weight:600;color:oklch(50% 0.16 258);cursor:pointer;white-space:nowrap\">Keep most active<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:12px;flex-wrap:wrap\">\n            <sc-for list=\"{{ grp.leads }}\" as=\"l\" hint-placeholder-count=\"2\">\n              <div style=\"flex:1;min-width:220px;border:1px solid oklch(92% 0.01 258);border-radius:9px;padding:13px\">\n                <div style=\"font-size:14px;font-weight:700;margin-bottom:6px\">{{ l.fullName }}<\u002Fdiv>\n                <div style=\"font-size:12px;color:oklch(45% 0.02 258);line-height:1.7\">\n                  {{ l.email }}<br>{{ l.phone }}<br>{{ l.school }}<br>{{ l.source }} · {{ l.stage }} · {{ l.ownerName }}<br>{{ l.activityCount }} activity entries\n                <\u002Fdiv>\n                <div sc-camel-on-click=\"{{ l.onKeep }}\" style=\"margin-top:12px;text-align:center;background:oklch(50% 0.16 258);color:#fff;font-size:12.5px;font-weight:600;padding:8px;border-radius:7px;cursor:pointer\">Keep this record<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isTeam }}\" hint-placeholder-val=\"{{ false }}\">\n      <sc-if value=\"{{ hasPendingSignups }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"max-width:640px;background:#fff;border:1px solid oklch(80% 0.13 85);border-radius:10px;overflow:hidden;margin-bottom:16px\">\n          <div style=\"padding:12px 16px;font-size:12px;font-weight:700;color:oklch(48% 0.13 70);text-transform:uppercase;background:oklch(96% 0.05 90)\">Pending sign-up requests<\u002Fdiv>\n          <sc-for list=\"{{ pendingSignupRows }}\" as=\"row\" hint-placeholder-count=\"1\">\n            <div style=\"display:flex;align-items:center;gap:10px;padding:12px 16px;border-top:1px solid oklch(94% 0.01 258)\">\n              <div style=\"flex:1\">\n                <div style=\"font-size:13.5px;font-weight:600\">{{ row.label }}<\u002Fdiv>\n                <div style=\"font-size:12px;color:oklch(50% 0.02 258)\">{{ row.username }} · {{ row.email }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div sc-camel-on-click=\"{{ row.onApprove }}\" style=\"background:oklch(50% 0.16 258);color:#fff;font-size:12.5px;font-weight:600;padding:7px 13px;border-radius:6px;cursor:pointer\">Approve<\u002Fdiv>\n              <div sc-camel-on-click=\"{{ row.onReject }}\" style=\"background:#fff;border:1px solid oklch(88% 0.01 258);color:oklch(45% 0.02 258);font-size:12.5px;font-weight:600;padding:7px 13px;border-radius:6px;cursor:pointer\">Reject<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <div style=\"max-width:640px;background:#fff;border:1px solid oklch(90% 0.01 258);border-radius:10px;padding:22px;margin-bottom:16px\">\n        <div style=\"font-size:14px;font-weight:700;margin-bottom:14px\">Create a rep account<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px\">\n          <input value=\"{{ newRepName }}\" sc-camel-on-change=\"{{ onNewRepNameChange }}\" placeholder=\"Full name\" style=\"padding:9px 11px;border:1px solid oklch(88% 0.01 258);border-radius:7px;font-size:13.5px\">\n          <input value=\"{{ newRepUsername }}\" sc-camel-on-change=\"{{ onNewRepUsernameChange }}\" placeholder=\"Username\" style=\"padding:9px 11px;border:1px solid oklch(88% 0.01 258);border-radius:7px;font-size:13.5px\">\n        <\u002Fdiv>\n        <input type=\"password\" value=\"{{ newRepPassword }}\" sc-camel-on-change=\"{{ onNewRepPasswordChange }}\" placeholder=\"Password\" style=\"width:100%;padding:9px 11px;border:1px solid oklch(88% 0.01 258);border-radius:7px;font-size:13.5px;margin-bottom:6px\">\n        <div style=\"font-size:11.5px;color:oklch(55% 0.02 258);margin-bottom:10px\">At least 8 characters, with letters and numbers.<\u002Fdiv>\n        <sc-if value=\"{{ hasNewRepError }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:12.5px;color:oklch(52% 0.15 25);margin-bottom:10px\">{{ newRepError }}<\u002Fdiv><\u002Fsc-if>\n        <div sc-camel-on-click=\"{{ onCreateRep }}\" style=\"display:inline-block;background:oklch(50% 0.16 258);color:#fff;font-size:13.5px;font-weight:600;padding:9px 18px;border-radius:7px;cursor:pointer\">Create account<\u002Fdiv>\n      <\u002Fdiv>\n      <div sc-camel-on-click=\"{{ onExportRepCredentials }}\" style=\"max-width:640px;margin-bottom:16px;display:inline-block;background:#fff;border:1px solid oklch(88% 0.01 258);color:oklch(38% 0.02 258);font-size:12.5px;font-weight:600;padding:8px 14px;border-radius:7px;cursor:pointer\">Export rep credentials (.csv)<\u002Fdiv>\n      <div style=\"max-width:640px;background:#fff;border:1px solid oklch(90% 0.01 258);border-radius:10px;overflow:hidden\">\n        <div style=\"padding:12px 16px;font-size:12px;font-weight:700;color:oklch(48% 0.02 258);text-transform:uppercase;background:oklch(96% 0.006 258)\">Rep accounts<\u002Fdiv>\n        <sc-for list=\"{{ teamRows }}\" as=\"row\" hint-placeholder-count=\"4\">\n          <div style=\"display:flex;align-items:center;gap:10px;padding:12px 16px;border-top:1px solid oklch(94% 0.01 258)\">\n            <div style=\"flex:1\">\n              <div style=\"font-size:13.5px;font-weight:600\">{{ row.label }}<\u002Fdiv>\n              <div style=\"font-size:11.5px;color:oklch(52% 0.02 258)\">{{ row.username }} · {{ row.email }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div sc-camel-on-click=\"{{ row.onResetPassword }}\" style=\"font-size:12.5px;font-weight:600;color:oklch(50% 0.16 258);cursor:pointer;white-space:nowrap\">Reset password<\u002Fdiv>\n            <div sc-camel-on-click=\"{{ row.onRemove }}\" style=\"font-size:12.5px;font-weight:600;color:oklch(52% 0.15 25);cursor:pointer;white-space:nowrap\">Remove<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <sc-if value=\"{{ teamRowsEmpty }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"padding:20px 16px;font-size:12.5px;color:oklch(55% 0.02 258)\">No rep accounts created yet.<\u002Fdiv><\u002Fsc-if>\n      <\u002Fdiv>\n\n      <div style=\"max-width:640px;background:#fff;border:1px solid oklch(90% 0.01 258);border-radius:10px;overflow:hidden;margin-top:16px\">\n        <div style=\"padding:12px 16px;font-size:12px;font-weight:700;color:oklch(48% 0.02 258);text-transform:uppercase;background:oklch(96% 0.006 258)\">Monthly targets (leads won)<\u002Fdiv>\n        <sc-for list=\"{{ repTargetRows }}\" as=\"rt\" hint-placeholder-count=\"4\">\n          <div style=\"padding:11px 16px;border-top:1px solid oklch(94% 0.01 258)\">\n            <div style=\"font-size:13.5px;font-weight:600;margin-bottom:8px\">{{ rt.name }}<\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(6,1fr);gap:6px\">\n              <sc-for list=\"{{ rt.months }}\" as=\"m\" hint-placeholder-count=\"12\">\n                <div>\n                  <div style=\"font-size:10px;color:oklch(55% 0.02 258);margin-bottom:2px;text-align:center\">{{ m.label }}<\u002Fdiv>\n                  <input type=\"number\" min=\"0\" value=\"{{ m.value }}\" sc-camel-on-change=\"{{ m.onChange }}\" style=\"width:100%;padding:6px 4px;border:1px solid oklch(88% 0.01 258);border-radius:6px;font-size:12px;text-align:center\">\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;gap:16px;margin-top:16px;flex-wrap:wrap\">\n        <div sc-camel-on-click=\"{{ onResetTeamAndRules }}\" style=\"font-size:12.5px;font-weight:600;color:oklch(50% 0.16 258);cursor:pointer\">Reset team &amp; rules to defaults<\u002Fdiv>\n        <div sc-camel-on-click=\"{{ onReapplyAssignmentRules }}\" style=\"font-size:12.5px;font-weight:600;color:oklch(50% 0.16 258);cursor:pointer\">Re-apply assignment rules to all leads<\u002Fdiv>\n        <div sc-camel-on-click=\"{{ onMergeSimilarSchools }}\" style=\"font-size:12.5px;font-weight:600;color:oklch(50% 0.16 258);cursor:pointer\">Merge similar school names<\u002Fdiv>\n        <div sc-camel-on-click=\"{{ onResetSampleData }}\" style=\"font-size:12.5px;font-weight:600;color:oklch(52% 0.15 25);cursor:pointer\">Remove all leads<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isBulk }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"max-width:640px;background:#fff;border:1px solid oklch(90% 0.01 258);border-radius:10px;padding:22px\">\n        <div style=\"font-size:14px;font-weight:700;margin-bottom:4px\">Audience<\u002Fdiv>\n        <div style=\"font-size:12.5px;color:oklch(50% 0.02 258);margin-bottom:14px\">Send to the entire database or filter down to a segment.<\u002Fdiv>\n        <div style=\"display:flex;gap:8px;margin-bottom:16px\">\n          <div sc-camel-on-click=\"{{ onBulkAudienceAll }}\" style=\"flex:1;text-align:center;padding:10px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;background:{{ bulkIsAll_bg }};color:{{ bulkIsAll_fg }};border:1px solid oklch(88% 0.01 258)\">Entire database<\u002Fdiv>\n          <div sc-camel-on-click=\"{{ onBulkAudienceCustom }}\" style=\"flex:1;text-align:center;padding:10px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;background:{{ bulkIsCustom_bg }};color:{{ bulkIsCustom_fg }};border:1px solid oklch(88% 0.01 258)\">Custom segment<\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ bulkIsCustom }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px\">\n            <sc-raw-select value=\"{{ bulkFilterSource }}\" sc-camel-on-change=\"{{ onBulkFilterSourceChange }}\" style=\"padding:9px 10px;border:1px solid oklch(88% 0.01 258);border-radius:7px;font-size:13px;background:#fff\">\n              <sc-for list=\"{{ sourceFilterOptions }}\" as=\"o\" hint-placeholder-count=\"8\"><option value=\"{{ o.value }}\">{{ o.label }}<\u002Foption><\u002Fsc-for>\n            <\u002Fsc-raw-select>\n            <sc-raw-select value=\"{{ bulkFilterStage }}\" sc-camel-on-change=\"{{ onBulkFilterStageChange }}\" style=\"padding:9px 10px;border:1px solid oklch(88% 0.01 258);border-radius:7px;font-size:13px;background:#fff\">\n              <sc-for list=\"{{ stageFilterOptions }}\" as=\"o\" hint-placeholder-count=\"6\"><option value=\"{{ o.value }}\">{{ o.label }}<\u002Foption><\u002Fsc-for>\n            <\u002Fsc-raw-select>\n            <sc-raw-select value=\"{{ bulkFilterOwner }}\" sc-camel-on-change=\"{{ onBulkFilterOwnerChange }}\" style=\"padding:9px 10px;border:1px solid oklch(88% 0.01 258);border-radius:7px;font-size:13px;background:#fff\">\n              <sc-for list=\"{{ ownerFilterOptions }}\" as=\"o\" hint-placeholder-count=\"5\"><option value=\"{{ o.value }}\">{{ o.label }}<\u002Foption><\u002Fsc-for>\n            <\u002Fsc-raw-select>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <div style=\"font-size:12.5px;color:oklch(45% 0.02 258);font-weight:600;margin-bottom:18px\">{{ bulkAudienceCount }} lead(s) match this audience.<\u002Fdiv>\n\n        <div style=\"font-size:14px;font-weight:700;margin-bottom:10px\">Channels<\u002Fdiv>\n        <div style=\"display:flex;gap:16px;margin-bottom:18px\">\n          <label style=\"display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;padding:8px 0;min-height:44px;box-sizing:border-box\"><input type=\"checkbox\" checked=\"{{ bulkChannelEmail }}\" sc-camel-on-change=\"{{ onToggleBulkEmail }}\">Email<\u002Flabel>\n          <label style=\"display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;padding:8px 0;min-height:44px;box-sizing:border-box\"><input type=\"checkbox\" checked=\"{{ bulkChannelSms }}\" sc-camel-on-change=\"{{ onToggleBulkSms }}\">SMS<\u002Flabel>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ bulkChannelEmail }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"font-size:12px;font-weight:600;color:oklch(45% 0.02 258);margin-bottom:5px\">Subject (email)<\u002Fdiv>\n          <input value=\"{{ bulkSubject }}\" sc-camel-on-change=\"{{ onBulkSubjectChange }}\" placeholder=\"e.g. Fall enrollment now open\" style=\"width:100%;padding:9px 11px;border:1px solid oklch(88% 0.01 258);border-radius:7px;font-size:13.5px;margin-bottom:14px\">\n        <\u002Fsc-if>\n        <div style=\"font-size:12px;font-weight:600;color:oklch(45% 0.02 258);margin-bottom:5px\">Message<\u002Fdiv>\n        <textarea value=\"{{ bulkMessage }}\" sc-camel-on-change=\"{{ onBulkMessageChange }}\" rows=\"5\" placeholder=\"Write your message…\" style=\"width:100%;padding:11px 12px;box-sizing:border-box;border:1px solid oklch(88% 0.01 258);border-radius:7px;font-size:14px;resize:vertical;margin-bottom:18px\"><\u002Ftextarea>\n        <div sc-camel-on-click=\"{{ onSendBulkMessage }}\" style=\"display:inline-block;background:oklch(50% 0.16 258);color:#fff;font-size:13.5px;font-weight:600;padding:11px 20px;border-radius:8px;cursor:pointer\">Send to {{ bulkAudienceCount }} lead(s)<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isIntegrations }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"background:#fff;border:1px solid oklch(90% 0.01 258);border-radius:10px;padding:20px;max-width:920px;margin-bottom:16px\">\n        <div style=\"display:flex;align-items:baseline;justify-content:space-between;margin-bottom:4px\"><div style=\"font-size:14px;font-weight:700\">Backend — Firebase (recommended)<\u002Fdiv><div style=\"background:oklch(93% 0.1 145);color:oklch(38% 0.13 145);font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px\">Faster &amp; reliable at scale<\u002Fdiv><\u002Fdiv>\n        <div style=\"font-size:12.5px;color:oklch(50% 0.02 258);margin-bottom:14px\">Each lead is its own record — an assignment change only writes what changed, instead of rewriting your whole dataset every time (which is what caused the Sheets sync failures).<\u002Fdiv>\n        <div style=\"display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px\">\n          <div sc-camel-on-click=\"{{ onPushAllToFirebase }}\" style=\"background:oklch(50% 0.16 258);color:#fff;font-size:12.5px;font-weight:600;padding:8px 14px;border-radius:7px;cursor:pointer\">Migrate all leads to Firebase<\u002Fdiv>\n          <div sc-camel-on-click=\"{{ onLoadFromFirebase }}\" style=\"background:oklch(94% 0.008 258);color:oklch(38% 0.02 258);font-size:12.5px;font-weight:600;padding:8px 14px;border-radius:7px;cursor:pointer\">Load leads from Firebase<\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ hasFirebaseStatus }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:12px;color:oklch(45% 0.02 258)\">{{ firebaseStatus }}<\u002Fdiv><\u002Fsc-if>\n        <sc-if value=\"{{ firebaseSyncing }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:12px;color:oklch(50% 0.16 258);font-weight:600;margin-top:4px\">⏳ {{ firebaseSyncLabel }}<\u002Fdiv><\u002Fsc-if>\n        <sc-if value=\"{{ hasFirebaseLastSync }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:11.5px;color:oklch(55% 0.02 258);margin-top:4px\">Last synced {{ firebaseLastSync }}<\u002Fdiv><\u002Fsc-if>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ false }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"background:#fff;border:1px solid oklch(90% 0.01 258);border-radius:10px;padding:20px;max-width:920px;margin-bottom:16px\">\n        <div style=\"display:none;font-size:14px;font-weight:700;margin-bottom:4px\">Backend — Google Sheets<\u002Fdiv>\n        <div style=\"display:none;font-size:12.5px;color:oklch(50% 0.02 258);margin-bottom:14px\">Lowest-cost real backend: a Google Sheet + a free Apps Script Web App acting as the API. Download the script below, paste it into your Sheet's Apps Script editor, deploy as a Web App (\"Anyone\" access), then paste the deployment URL here.<\u002Fdiv>\n        <div style=\"font-size:12px;font-weight:600;color:oklch(45% 0.02 258);margin-bottom:5px\">Web App URL<\u002Fdiv>\n        <input value=\"{{ sheetsApiUrl }}\" sc-camel-on-change=\"{{ onSheetsApiUrlChange }}\" placeholder=\"https://script.google.com/macros/s/…/exec\" style=\"width:100%;padding:9px 11px;border:1px solid oklch(88% 0.01 258);border-radius:7px;font-size:13.5px;margin-bottom:12px\">\n        <div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px\">\n          <div sc-camel-on-click=\"{{ onDownloadAppsScript }}\" style=\"background:#fff;border:1px solid oklch(88% 0.01 258);color:oklch(40% 0.02 258);font-size:12.5px;font-weight:600;padding:8px 14px;border-radius:7px;cursor:pointer;white-space:nowrap\">Download setup script (.gs)<\u002Fdiv>\n          <div sc-camel-on-click=\"{{ onTestSheetsConnection }}\" style=\"background:#fff;border:1px solid oklch(88% 0.01 258);color:oklch(40% 0.02 258);font-size:12.5px;font-weight:600;padding:8px 14px;border-radius:7px;cursor:pointer;white-space:nowrap\">Test connection<\u002Fdiv>\n          <div sc-camel-on-click=\"{{ onPushToSheets }}\" style=\"background:oklch(50% 0.16 258);color:#fff;font-size:12.5px;font-weight:600;padding:8px 14px;border-radius:7px;cursor:pointer;white-space:nowrap\">Push leads to Sheet<\u002Fdiv>\n          <div sc-camel-on-click=\"{{ onLoadFromSheets }}\" style=\"background:oklch(94% 0.008 258);color:oklch(38% 0.02 258);font-size:12.5px;font-weight:600;padding:8px 14px;border-radius:7px;cursor:pointer;white-space:nowrap\">Load leads from Sheet<\u002Fdiv>\n        <\u002Fdiv>\n        <label style=\"display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;margin-bottom:10px\"><input type=\"checkbox\" checked=\"{{ sheetsAutoSync }}\" sc-camel-on-change=\"{{ onToggleSheetsAutoSync }}\">Auto-push on every change<\u002Flabel>\n        <sc-if value=\"{{ hasSheetsStatus }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:12px;color:oklch(45% 0.02 258)\">{{ sheetsStatus }}<\u002Fdiv><\u002Fsc-if>\n        <sc-if value=\"{{ sheetsSyncing }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:12px;color:oklch(50% 0.16 258);font-weight:600;margin-top:4px\">⏳ {{ sheetsSyncLabel }}<\u002Fdiv><\u002Fsc-if>\n        <sc-if value=\"{{ hasSheetsLastSync }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:11.5px;color:oklch(55% 0.02 258);margin-top:4px\">Last synced {{ sheetsLastSync }}<\u002Fdiv><\u002Fsc-if>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <div style=\"background:#fff;border:1px solid oklch(90% 0.01 258);border-radius:10px;padding:20px;max-width:920px;margin-bottom:16px\">\n        <div style=\"font-size:14px;font-weight:700;margin-bottom:4px\">Google Sign-In<\u002Fdiv>\n        <div style=\"font-size:12.5px;color:oklch(50% 0.02 258);margin-bottom:14px\">Lets reps sign in with their Google account (matched by email to existing accounts, or auto-created). Needs a real OAuth Client ID from Google Cloud Console with this app's deployed domain authorized as a JavaScript origin — won't work from this preview's rotating URL, only once deployed to a fixed domain. For real security also verify the ID token server-side.<\u002Fdiv>\n        <div style=\"font-size:12px;font-weight:600;color:oklch(45% 0.02 258);margin-bottom:5px\">OAuth Client ID<\u002Fdiv>\n        <input value=\"{{ googleClientId }}\" sc-camel-on-change=\"{{ onGoogleClientIdChange }}\" placeholder=\"xxxxxxxx.apps.googleusercontent.com\" style=\"width:100%;padding:9px 11px;border:1px solid oklch(88% 0.01 258);border-radius:7px;font-size:13.5px\">\n      <\u002Fdiv>\n\n      <div style=\"background:#fff;border:1px solid oklch(90% 0.01 258);border-radius:10px;padding:20px;max-width:920px;margin-bottom:16px\">\n        <div style=\"font-size:14px;font-weight:700;margin-bottom:4px\">Two-factor login<\u002Fdiv>\n        <div style=\"font-size:12.5px;color:oklch(50% 0.02 258);margin-bottom:14px\">Requires a 6-digit code after username/password. Demo mode logs the code to the console (and texts it if an SMS proxy is configured above) — no real delivery is guaranteed without one.<\u002Fdiv>\n        <label style=\"display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer\"><input type=\"checkbox\" checked=\"{{ twoFactorEnabled }}\" sc-camel-on-change=\"{{ onToggleTwoFactorEnabled }}\">Require two-factor login for all accounts<\u002Flabel>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:920px\">\n        <div style=\"background:#fff;border:1px solid oklch(90% 0.01 258);border-radius:10px;padding:20px\">\n          <div style=\"font-size:14px;font-weight:700;margin-bottom:4px\">Webhook<\u002Fdiv>\n          <div style=\"font-size:12.5px;color:oklch(50% 0.02 258);margin-bottom:14px\">Fire an HTTP POST to your endpoint on lead events. This is a stub — payloads are logged to the console instead of sent.<\u002Fdiv>\n          <div style=\"font-size:12px;font-weight:600;color:oklch(45% 0.02 258);margin-bottom:5px\">Endpoint URL<\u002Fdiv>\n          <input value=\"{{ integrationsWebhookUrl }}\" sc-camel-on-change=\"{{ onWebhookUrlChange }}\" placeholder=\"https://your-app.com/webhooks/zues\" style=\"width:100%;padding:9px 11px;border:1px solid oklch(88% 0.01 258);border-radius:7px;font-size:13.5px;margin-bottom:14px\">\n          <div style=\"font-size:12px;font-weight:700;color:oklch(48% 0.02 258);text-transform:uppercase;margin-bottom:8px\">Trigger on<\u002Fdiv>\n          <label style=\"display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:8px;cursor:pointer\"><input type=\"checkbox\" checked=\"{{ webhookOnCreate }}\" sc-camel-on-change=\"{{ onToggleWebhookOnCreate }}\">Lead created<\u002Flabel>\n          <label style=\"display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:8px;cursor:pointer\"><input type=\"checkbox\" checked=\"{{ webhookOnStageChange }}\" sc-camel-on-change=\"{{ onToggleWebhookOnStageChange }}\">Pipeline stage changed<\u002Flabel>\n          <label style=\"display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:16px;cursor:pointer\"><input type=\"checkbox\" checked=\"{{ webhookOnReminder }}\" sc-camel-on-change=\"{{ onToggleWebhookOnReminder }}\">Reminder sent<\u002Flabel>\n          <div sc-camel-on-click=\"{{ onTestWebhook }}\" style=\"display:inline-block;background:oklch(50% 0.16 258);color:#fff;font-size:13px;font-weight:600;padding:9px 16px;border-radius:7px;cursor:pointer\">Send test webhook<\u002Fdiv>\n          <sc-if value=\"{{ hasLastTestPayload }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font-size:11px;color:oklch(52% 0.02 258);margin:12px 0 6px\">Last sent {{ lastTestAt }}:<\u002Fdiv>\n            <pre style=\"background:oklch(97% 0.006 258);border:1px solid oklch(90% 0.01 258);border-radius:7px;padding:10px;font-size:11.5px;overflow-x:auto;white-space:pre-wrap\">{{ lastTestPayload }}<\u002Fpre>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid oklch(90% 0.01 258);border-radius:10px;padding:20px\">\n          <div style=\"font-size:14px;font-weight:700;margin-bottom:4px\">Email provider<\u002Fdiv>\n          <div style=\"font-size:12.5px;color:oklch(50% 0.02 258);margin-bottom:14px\">Connect a transactional email provider. This is a stub — no messages leave the app yet.<\u002Fdiv>\n          <div style=\"font-size:12px;font-weight:600;color:oklch(45% 0.02 258);margin-bottom:5px\">Provider<\u002Fdiv>\n          <sc-raw-select value=\"{{ emailProvider }}\" sc-camel-on-change=\"{{ onEmailProviderChange }}\" style=\"width:100%;padding:9px 11px;border:1px solid oklch(88% 0.01 258);border-radius:7px;font-size:13.5px;background:#fff;margin-bottom:14px\">\n            <sc-for list=\"{{ emailProviderOptions }}\" as=\"o\" hint-placeholder-count=\"4\"><option value=\"{{ o.value }}\">{{ o.label }}<\u002Foption><\u002Fsc-for>\n          <\u002Fsc-raw-select>\n          <div style=\"font-size:12px;font-weight:600;color:oklch(45% 0.02 258);margin-bottom:5px\">API key<\u002Fdiv>\n          <input type=\"password\" value=\"{{ emailApiKey }}\" sc-camel-on-change=\"{{ onEmailApiKeyChange }}\" placeholder=\"sk_live_…\" style=\"width:100%;padding:9px 11px;border:1px solid oklch(88% 0.01 258);border-radius:7px;font-size:13.5px;margin-bottom:14px\">\n          <div style=\"font-size:12px;font-weight:600;color:oklch(45% 0.02 258);margin-bottom:5px\">From address<\u002Fdiv>\n          <input value=\"{{ emailFromAddress }}\" sc-camel-on-change=\"{{ onEmailFromAddressChange }}\" style=\"width:100%;padding:9px 11px;border:1px solid oklch(88% 0.01 258);border-radius:7px;font-size:13.5px;margin-bottom:16px\">\n          <div sc-camel-on-click=\"{{ onTestEmail }}\" style=\"display:inline-block;background:#fff;border:1px solid oklch(88% 0.01 258);color:oklch(40% 0.02 258);font-size:13px;font-weight:600;padding:9px 16px;border-radius:7px;cursor:pointer\">Send test email<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid oklch(90% 0.01 258);border-radius:10px;padding:20px\">\n          <div style=\"font-size:14px;font-weight:700;margin-bottom:4px\">SMS provider<\u002Fdiv>\n          <div style=\"font-size:12.5px;color:oklch(50% 0.02 258);margin-bottom:14px\">Real credentials can't live in this client-side app. Point this at a backend/serverless proxy that holds your Twilio (or other) credentials and relays the message — leave the URL blank to keep this a logged-only stub.<\u002Fdiv>\n          <div style=\"font-size:12px;font-weight:600;color:oklch(45% 0.02 258);margin-bottom:5px\">Proxy endpoint URL<\u002Fdiv>\n          <input value=\"{{ smsProxyUrl }}\" sc-camel-on-change=\"{{ onSmsProxyUrlChange }}\" placeholder=\"https://your-backend.com/api/send-sms\" style=\"width:100%;padding:9px 11px;border:1px solid oklch(88% 0.01 258);border-radius:7px;font-size:13.5px;margin-bottom:14px\">\n          <div style=\"font-size:12px;font-weight:600;color:oklch(45% 0.02 258);margin-bottom:5px\">Provider<\u002Fdiv>\n          <sc-raw-select value=\"{{ smsProvider }}\" sc-camel-on-change=\"{{ onSmsProviderChange }}\" style=\"width:100%;padding:9px 11px;border:1px solid oklch(88% 0.01 258);border-radius:7px;font-size:13.5px;background:#fff;margin-bottom:14px\">\n            <sc-for list=\"{{ smsProviderOptions }}\" as=\"o\" hint-placeholder-count=\"3\"><option value=\"{{ o.value }}\">{{ o.label }}<\u002Foption><\u002Fsc-for>\n          <\u002Fsc-raw-select>\n          <div style=\"font-size:12px;font-weight:600;color:oklch(45% 0.02 258);margin-bottom:5px\">API key (stub mode only)<\u002Fdiv>\n          <input type=\"password\" value=\"{{ smsApiKey }}\" sc-camel-on-change=\"{{ onSmsApiKeyChange }}\" placeholder=\"sk_live_…\" style=\"width:100%;padding:9px 11px;border:1px solid oklch(88% 0.01 258);border-radius:7px;font-size:13.5px;margin-bottom:14px\">\n          <div style=\"font-size:12px;font-weight:600;color:oklch(45% 0.02 258);margin-bottom:5px\">From number<\u002Fdiv>\n          <input value=\"{{ smsFromNumber }}\" sc-camel-on-change=\"{{ onSmsFromNumberChange }}\" placeholder=\"+1 555 0100\" style=\"width:100%;padding:9px 11px;border:1px solid oklch(88% 0.01 258);border-radius:7px;font-size:13.5px;margin-bottom:16px\">\n          <div sc-camel-on-click=\"{{ onTestSms }}\" style=\"display:inline-block;background:#fff;border:1px solid oklch(88% 0.01 258);color:oklch(40% 0.02 258);font-size:13px;font-weight:600;padding:9px 16px;border-radius:7px;cursor:pointer\">Send test SMS<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid oklch(90% 0.01 258);border-radius:10px;padding:20px\">\n          <div style=\"font-size:14px;font-weight:700;margin-bottom:4px\">WhatsApp delivery<\u002Fdiv>\n          <div style=\"font-size:12.5px;color:oklch(50% 0.02 258);margin-bottom:14px\">wa.me links open WhatsApp but can't confirm delivery. Point this at a WhatsApp Business API proxy to log real delivery status — leave blank to just log that the chat was opened.<\u002Fdiv>\n          <div style=\"font-size:12px;font-weight:600;color:oklch(45% 0.02 258);margin-bottom:5px\">Proxy endpoint URL<\u002Fdiv>\n          <input value=\"{{ whatsappProxyUrl }}\" sc-camel-on-change=\"{{ onWhatsappProxyUrlChange }}\" placeholder=\"https://your-backend.com/api/send-whatsapp\" style=\"width:100%;padding:9px 11px;border:1px solid oklch(88% 0.01 258);border-radius:7px;font-size:13.5px\">\n        <\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid oklch(90% 0.01 258);border-radius:10px;padding:20px\">\n          <div style=\"font-size:14px;font-weight:700;margin-bottom:4px\">Browser notifications<\u002Fdiv>\n          <div style=\"font-size:12.5px;color:oklch(50% 0.02 258);margin-bottom:14px\">Show a native browser notification when a follow-up is due or overdue, on top of the in-app reminder.<\u002Fdiv>\n          <label style=\"display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer\"><input type=\"checkbox\" checked=\"{{ browserNotificationsEnabled }}\" sc-camel-on-change=\"{{ onToggleBrowserNotifications }}\">Enable browser notifications<\u002Flabel>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isMobile }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"min-height:100vh;display:flex;flex-direction:column;background:oklch(97% 0.006 258)\">\n  <div style=\"display:flex;align-items:center;gap:10px;padding:14px 16px;background:oklch(20% 0.03 258);position:sticky;top:0;z-index:5\">\n    <div style=\"width:26px;height:26px;border-radius:7px;background:oklch(66% 0.15 258);display:flex;align-items:center;justify-content:center\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M12 3L2 8l10 5 8-4.09V17h2V8L12 3z\" fill=\"white\"><\u002Fpath><path d=\"M6 11.5V16c0 1.5 2.7 3 6 3s6-1.5 6-3v-4.5l-6 3-6-3z\" fill=\"white\" opacity=\"0.85\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n    <div style=\"color:#fff;font-size:17px;font-weight:800;flex:1;letter-spacing:0.6px\">ZUES<\u002Fdiv>\n    <div style=\"color:oklch(80% 0.02 258);font-size:12px;font-weight:600;background:oklch(28% 0.03 258);padding:6px 10px;border-radius:999px\">{{ roleLabel }}<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"flex:1;padding:16px;padding-bottom:90px;overflow-y:auto\">\n    <div style=\"font-size:19px;font-weight:700;margin-bottom:2px\">{{ viewTitle }}<\u002Fdiv>\n    <div style=\"font-size:12.5px;color:oklch(50% 0.02 258);margin-bottom:16px\">{{ viewSubtitle }}<\u002Fdiv>\n\n    <sc-if value=\"{{ isDashboard }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px\">\n        <sc-for list=\"{{ statCards }}\" as=\"card\" hint-placeholder-count=\"4\">\n          <div sc-camel-on-click=\"{{ card.onClick }}\" style=\"background:#fff;border:1px solid oklch(90% 0.01 258);border-radius:10px;padding:14px;cursor:pointer\">\n            <div style=\"font-size:11.5px;color:oklch(52% 0.02 258);font-weight:600;margin-bottom:6px\">{{ card.label }}<\u002Fdiv>\n            <div style=\"font-size:21px;font-weight:700\">{{ card.value }}<\u002Fdiv>\n            <sc-if value=\"{{ card.sub }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:11px;color:oklch(52% 0.02 258);margin-top:3px\">{{ card.sub }}<\u002Fdiv><\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid oklch(90% 0.01 258);border-radius:10px;padding:16px\">\n        <div style=\"font-size:13.5px;font-weight:700;margin-bottom:12px\">Leads by Source<\u002Fdiv>\n        <sc-for list=\"{{ sourceStats }}\" as=\"s\" hint-placeholder-count=\"7\">\n          <div sc-camel-on-click=\"{{ s.onClick }}\" style=\"display:flex;align-items:center;gap:8px;margin-bottom:9px;cursor:pointer\">\n            <div style=\"width:80px;flex:none;font-size:11.5px;color:oklch(40% 0.02 258)\">{{ s.label }}<\u002Fdiv>\n            <div style=\"flex:1;height:11px;background:oklch(93% 0.01 258);border-radius:5px;overflow:hidden\"><div style=\"height:100%;width:{{ s.pct }};background:oklch(62% 0.13 258);border-radius:5px\"><\u002Fdiv><\u002Fdiv>\n            <div style=\"width:18px;flex:none;font-size:11.5px;font-weight:700;text-align:right\">{{ s.count }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid oklch(90% 0.01 258);border-radius:10px;padding:16px;margin-top:12px\">\n        <div style=\ ; }\n  downloadImportTemplate() {\n    const headers = ['First Name', 'Last Name', 'Email', 'Phone', 'School', 'Source', 'Programme', 'Stage', 'Value', 'Next Follow Up', 'Notes', 'Parent Name', 'Parent Phone', 'Parent Email'];\n    const sample = ['Jane', 'Doe', 'jane.doe@example.com', '+1 555 0100', 'Bridgeview High', SOURCES[0], PROGRAMMES[0], 'New', '15000', '', 'Interested in Fall intake', 'John Doe', '+1 555 0101', 'john.doe@example.com'];\n    const csv = [headers, sample].map(row => row.map(v => `\"${String(v).replace(/\"/g, '\"\"')}\"`).join(',')).join('\\n');\n    const blob = new Blob([csv], { type: 'text/csv' });\n    const link = document.createElement('a');\n    link.href = URL.createObjectURL(blob);\n    link.download = 'zues-leads-import-template.csv';\n    link.click();\n    URL.revokeObjectURL(link.href);\n  }\n  closeImport() { this.setState({ showImportModal: false }); }\n  dedupeKey(r) {\n    const email = String(r.email ?? '').trim().toLowerCase();\n    if (email) return `email:${email}`;\n    return `name:${String(r.firstName ?? '').trim().toLowerCase()}|${String(r.lastName ?? '').trim().toLowerCase()}|${String(r.school ?? '').trim().toLowerCase()}`;\n  }\n  computeDuplicateGroups(leads) {\n    const map = new Map();\n    leads.forEach(l => {\n      const key = this.dedupeKey(l);\n      if (!map.has(key)) map.set(key, []);\n      map.get(key).push(l);\n    });\n    return [...map.entries()].filter(([, group]) => group.length > 1).map(([key, group]) => ({ key, leads: group }));\n  }\n  mergeLeads(keepId, groupIds) {\n    this.setState(s => {\n      const removed = s.leads.filter(l => groupIds.includes(l.id) && l.id !== keepId);\n      const mergedActivity = removed.flatMap(l => l.activity || []);\n      const leads = s.leads\n        .filter(l => !groupIds.includes(l.id) || l.id === keepId)\n        .map(l => l.id === keepId ? { ...l, activity: [...(l.activity || []), ...mergedActivity, { ts: new Date().toISOString(), text: `Merged ${removed.len    const newLeads = toImport.map((r, i) => {\n      const source = validSources.has(r.source) ? r.source : (r.source || SOURCES[0]);\n      const stage = validStages.has(r.stage) ? r.stage : 'New';\n      const ownerId = defaultOwner || this.resolveAssignment(r.school);\n      const importedDate = r.createdAt && /^\\d{4}-\\d{2}-\\d{2}$/.test(r.createdAt.trim()) ? r.createdAt.trim() : null;\n      return {\n        id: Date.now() + i,\n        firstName: r.firstName || '—', lastName: r.lastName || '', email: r.email, phone: r.phone,\n        school: r.school, source, programme: r.programme || PROGRAMMES[0], stage, ownerId,\n        value: Number(r.value) || 15000, createdAt: importedDate || new Date().toISOString().slice(0, 10),\n        nextFollowUp: r.nextFollowUp || null, notes: r.notes || '',\n        parentName: r.parentName || '', parentPhone: r.parentPhone || '', parentEmail: r.parentEmail || '',\n        activity: [{ ts: new Date().toISOString(), text: 'Lead created via CSV import' }],\n      };\n    });\n    const msg = `Imported ${newLeads.length} lead${newLeads.length === 1 ? '' : 's'}.` + (skipped > 0 ? ` Skipped ${skipped} duplicate${skipped === 1 ? '' : 's'}.` : '');\n    this.setState(s => ({ leads: [...s.leads, ...newLeads], showImportModal: false, toast: msg }));\n    if (this.toastTimer) clearTimeout(this.toastTimer);\n    this.toastTimer = setTimeout(() => this.setState({ toast: null }), 3200);\n  }\n\n  exportSourceAnalytics(sourceStats) {\n    const rows = [['Source', 'Lead Count'], ...sourceStats.map(s => [s.label, String(s.count)])];\n    const csv = rows.map(r => r.map(v => `\"${v.replace(/\"/g, '\"\"')}\"`).join(',')).join('\\n');\n    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });\n    const url = URL.createObjectURL(blob);\n    const a = document.createElement('a');\n    a.href = url; a.download = 'lead-source-analytics.csv';\n    document.body.appendChild(a); a.click(); document.body.removeChild(a);\n    URL.revokeObjectURL(url);\n  }\n\n  saveLead() {\n    const fd = this.state.formData;\n    if (!String(fd.firstName || '').trim() || !String(fd.lastName || '').trim()) return;\n    const resolvedOwner = fd.ownerId === 'auto' ? this.resolveAssignment(fd.school) : fd.ownerId;\n    const cleaned = { ...fd, ownerId: resolvedOwner, value: Number(fd.value) || 0, nextFollowUp: fd.nextFollowUp || null };\n    if (this.state.isEditMode) {\n      this.setState(s => ({ leads: s.leads.map(l => l.id === s.editingId ? { ...l, ...cleaned, activity: [...(l.activity || []), { ts: new Date().toISOString(), text: 'Lead details updated' }] } : l), showModal: false }));\n      return;\n    }\n    const key = this.dedupeKey(cleaned);\n    if (this.state.leads.some(l => this.dedupeKey(l) === key)) {\n      this.setState({ formError: 'This lead has already been captured.' });\n      return;\n    }\n    const ts = new Date().toISOString();\n    const newId = Date.now();\n    const effectiveRole = this.state.currentUser === 'manager' ? this.state.role : this.state.currentUser;\n    const nextForm = { ...emptyForm(), ownerId: effectiveRole !== 'manager' ? effectiveRole : 'auto' };\n    this.setState(s => ({ leads: [...s.leads, { ...cleaned, id: newId, createdAt: ts.slice(0,10), activity: [{ ts, text: 'Lead created' }] }], formData: nextForm, formError: '', showCapturedBanner: true }));\n    this.fireIntegrationWebhook('lead_created', { leadId: newId, source: cleaned.source });\n    if (this.capturedBannerTimer) clearTimeout(this.capturedBannerTimer);\n    this.capturedBannerTimer = setTimeout(() => this.setState({ showCapturedBanner: false }), 1600);\n  }\n  toggleLeadSelection(id) {\n    this.setState(s => ({ selectedLeadIds: s.selectedLeadIds.includes(id) ? s.selectedLeadIds.filter(x => x !== id) : [...s.selectedLeadIds, id] }));\n  }\n  clearLeadSelection() { this.setState({ selectedLeadIds: [], bulkReassignTarget: '' }); }\n  updateBulkReassignTarget(v) { this.setState({ bulkReassignTarget: v }); }\n  b id, `${channelLabel} reminder sent to ${rep ? rep.name : 'rep'}`);\n    if (channel === 'email' || channel === 'sms') this.fireIntegrationWebhook('reminder_sent', { leadId: lead.id, channel, rep: rep ? rep.name : null });\n    if (channel === 'sms') {\n      const cfg = this.state.integrations;\n      if (cfg.smsProxyUrl.trim() && lead.phone) {\n        this.sendSmsViaProxy(cfg.smsProxyUrl, { to: lead.phone, from: cfg.smsFromNumber, body: `Reminder: follow up with ${lead.firstName} ${lead.lastName}.` })\n          .then(ok => this.logActivity(lead.id, ok ? 'SMS delivered' : 'SMS delivery failed'));\n      } else {\n        console.log('[sms stub] would send via', cfg.smsProvider, { leadId: lead.id });\n        this.logActivity(lead.id, 'SMS delivery status: stub (no proxy configured)');\n      }\n    }\n    if (channel === 'whatsapp') this.logWhatsappDeliveryStatus(lead);\n    if (this.toastTimer) clearTimeout(this.toastTimer);\n    this.toastTimer = setTimeout(() => this.setState({ toast: null }), 3200);\n  }\n\n  // --- Integration stubs: real deployments would POST to webhookUrl and call an email/SMS\n  // provider API here (SendGrid/Twilio/etc). We log the payload and surface it in the UI so\n  // the shape of the integration is visible without wiring live credentials.\n  updateIntegrationField(key, value) {\n    this.setState(s => ({ integrations: { ...s.integrations, [key]: value } }));\n  }\n  toggleIntegrationFlag(key) {\n    this.setState(s => ({ integrations: { ...s.integrations, [key]: !s.integrations[key] } }));\n  }\n  fireIntegrationWebhook(event, data) {\n    const cfg = this.state.integrations;\n    const flagMap = { lead_created: 'webhookOnCreate', stage_changed: 'webhookOnStageChange', reminder_sent: 'webhookOnReminder' };\n    if (!cfg.webhookUrl || !cfg[flagMap[event]]) return;\n    const payload = { event, timestamp: new Date().toISOString(), ...data };\n    console.log('[webhook stub] would POST to', cfg.webhookUrl, payload);\n  }\n  testWebhoo .newRepPassword) { this.setState({ newRepError: 'Fill in name, username, and password.' }); return; }\n    const pwErr = this.passwordStrengthError(s.newRepPassword);\n    if (pwErr) { this.setState({ newRepError: pwErr }); return; }\n    if (this.getAllCredentials().some(c => c.username === username)) { this.setState({ newRepError: 'That username is already taken.' }); return; }\n    const account = { username, password: s.newRepPassword, role: username, label: name, email: `${username}@zues.com` };\n    this.setState({ customAccounts: [...s.customAccounts, account], newRepName: '', newRepUsername: '', newRepPassword: '', newRepError: '', toast: `Created account for ${name}.` });\n  }\n  resetRepPassword(username, newPassword) {\n    if (!newPassword) return;\n    const pwErr = this.passwordStrengthError(newPassword);\n    if (pwErr) { window.alert(pwErr); return; }\n    this.setState(s => ({ customAccounts: s.customAccounts.map(a => a.username === username ? { ...a, password: newPassword } : a), toast: `Password updated for ${username}.` }));\n  }\n  // --- Fuzzy school-name merge: flags schools whose names are >=70% similar (Levenshtein-based),\n  // merges each group onto its longest variant (the fuller, more complete name), rewrites every\n  // matching lead's school field and the assignment rule for that school.\n  levDist(a, b) {\n    const dp = Array.from({ length: a.length + 1 }, (_, i) => [i, ...Array(b.length).fill(0)]);\n    for (let j = 0; j <= b.length; j++) dp[0][j] = j;\n    for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)\n      dp[i][j] = a[i - 1] === b[j - 1] ? dp[i - 1][j - 1] : 1 + Math.min(dp[i - 1][j - 1], dp[i - 1][j], dp[i][j - 1]);\n    return dp[a.length][b.length];\n  }\n  mergeSimilarSchools() {\n    const schools = Array.from(new Set(this.state.leads.map(l => (l.school || '').trim()).filter(Boolean)));\n    if (schools.length < 2) { this.setState({ toast: 'Not enough distinct schools to compare.' }); return; }\n    const SUFFIX_WORDS = ['secondaryschool', 'secschool', 'secondary', 'second', 'highschool', 'high', 'comprehensiveschool', 'comprehensive', 'sos', 'school', 'technicalhighschool', 'technical', 'hs'];\n    const coreOf = (s) => {\n      let core = s.toLowerCase().replace(/[^a-z0-9]/g, '');\n      SUFFIX_WORDS.forEach(w => { core = core.split(w).join(''); });\n      return core;\n    };\n    const parent = new Map(schools.map(s => [s, s]));\n    const find = (s) => { while (parent.get(s) !== s) s = parent.get(s); return s; };\n    const union = (a, b) => { const ra = find(a), rb = find(b); if (ra !== rb) parent.set(ra, rb); };\n    for (let i = 0; i < schools.length; i++) {\n      for (let j = i + 1; j < schools.length; j++) {\n        const a = coreOf(schools[i]), b = coreOf(schools[j]);\n        if (!a || !b || Math.min(a.length, b.length) < 4) continue;\n        const dist = this.levDist(a, b);\n        const maxLen = Math.max(a.length, b.length);\n        const similarity = 1 - dist / maxLen;\n        const threshold = maxLen > 12 ? 0.8 : 0.75;\n        if (similarity >= threshold) union(schools[i], schools[j]);\n      }\n    }\n    const groups = new Map();\n    schools.forEach(s => { const root = find(s); if (!groups.has(root)) groups.set(root, []); groups.get(root).push(s); });\n    const rename = new Map(); // original school -> canonical\n    let mergedGroupCount = 0, mergedSchoolCount = 0;\n    groups.forEach(members => {\n      if (members.length < 2) return;\n      mergedGroupCount++;\n      mergedSchoolCount += members.length;\n      const canonical = members.slice().sort((a, b) => b.length - a.length)[0];\n      members.forEach(m => rename.set(m, canonical));\n    });\n    if (!mergedGroupCount) { this.setState({ toast: 'No similar school names found (70%+ threshold).' }); return; }\n    if (!window.confirm(`Merge ${mergedSchoolCount} school name(s) into ${mergedGroupCount} canonical school(s)? This updates every matching lead and assignment rule.`)) return;\n\n    const leadCountByOriginal = new Map();\n    schools.forEach(s => leadCountByOriginal.set(s, this.state.leads.filter(l => (l.school || '').trim() === s).length));\n    const report = [];\n    groups.forEach(members => {\n      if (members.length < 2) return;\n      const canonical = rename.get(members[0]);\n      const variants = members.filter(m => m !== canonical);\n      report.push({\n        canonical,\n        variants,\n        leadCount: members.reduce((sum, m) => sum + (leadCountByOriginal.get(m) || 0), 0),\n      });\n    });\n\n    this.setState(s => {\n      const leads = s.leads.map(l => rename.has((l.school || '').trim()) ? { ...l, school: rename.get(l.school.trim()) } : l);\n      const assignmentRules = { ...s.assignmentRules };\n      rename.forEach((canonical, original) => {\n        if (canonical === original) return;\n        const oldKey = original.toLowerCase();\n        const newKey = canonical.toLowerCase();\n        if (Object.prototype.hasOwnProperty.call(assignmentRules, oldKey)) {\n          const oldVal = assignmentRules[oldKey];\n          if (!Object.prototype.hasOwnProperty.call(assignmentRules, newKey) || !assignmentRules[newKey]) {\n            assignmentRules[newKey] = oldVal;\n          }\n          delete assignmentRules[oldKey];\n        }\n      });\n      return { leads, assignmentRules, toast: `Merged ${mergedSchoolCount} school name(s) into ${mergedGroupCount} school(s).`, schoolMergeReport: report };\n    });\n  }\n  dismissSchoolMergeReport() { this.setState({ schoolMergeReport: null }); }\n  reapplyAssignmentRules() {\n    if (!window.confirm('Re-run assignment rules on all leads? This will overwrite every lead\\'s current owner based on its school\\'s rule (or mark it unassigned). Manual reassignments will be lost.')) return;\n    this.rrIndex = 0;\n    const prevLeads = this.state.leads;\n    const nextLeads = prevLeads.map(l => ({ ...l, ownerId: this.resolveAssignment(l.school) }));\n    const changed = nextLeads.filter((l, i) => l.ownerId !== prevLeads[i].ownerId);\n    this.setState({\n      leads: nextLeads,\n      toast: 'Assignment rules re-applied to all leads.',\n    }, () => {\n      this.pushAssignmentRulesToFirebase(true);\n      if (changed.length) {\n        this.pushLeadsBatchToFirebase(changed, true, () => {\n          this.setState({ toast: `Synced — ${changed.length.toLocaleString()} reassigned lead(s) now live for reps.` });\n        });\n      }\n    });\n  }\n  resetTeamAndRules() {\n    if (!window.confirm('Reset reps and assignment rules to the app defaults? Custom reps you\\'ve added will be kept, but any custom assignment rules will be replaced.')) return;\n    this.setState({ assignmentRules: { ...DEFAULT_ASSIGNMENT_RULES }, toast: 'Reps and assignment rules reset to defaults.' }, () => this.pushAssignmentsIfConfigured());\n  }\n  resetSampleData() {\n    if (!window.confirm('Remove ALL leads? This cannot be undone.')) return;\n    this.setState({ leads: [], selectedLeadIds: [], toast: 'All leads removed.' });\n  }\n  exportRepCredentials() {\n    const rows = this.getAllCredentials().filter(c => c.username !== 'manager');\n    const headers = ['Name', 'Username', 'Password', 'Email'];\n    const csv = [headers, ...rows.map(c => [c.label, c.username, c.password || '(set by rep)', c.email])]\n      .map(row => row.map(v => `\"${String(v ?? '').replace(/\"/g, '\"\"')}\"`).join(',')).join('\\n');\n    const blob = new Blob([csv], { type: 'text/csv' });\n    const link = document.createElement('a');\n    link.href = URL.createObjectURL(blob);\n    link.download = 'zues-rep-credentials.csv';\n    link.click();\n    URL.revokeObjectURL(link.href);\n  }\n  removeRep(username) {\n    this.setState(s => ({ customAccounts: s.customAccounts.filter(a => a.username !== username), toast: `Removed ${username}.` }));\n  }\n  updateBulkField(key, value) { this.setState({ [key]: value }); }\n  toggleBulkChannel(key) { this.setState(s => ({ [key]: !s[key] })); }\n  getBulkAudience() {\n    const s = this.state;\n    const isManagerLogin = s.currentUser === 'manager';\n    const effectiveRole = isManagerLogin ? s.role : s.currentUser;\n    const isManagerRole = effectiveRole === 'manager';\n    const base = isManagerRole ? s.leads : s.leads.filter(l => l.ownerId === effectiveRole);\n    if (s.bulkAudience === 'all') return base;\n    return base.filter(l => {\n      if (s.bulkFilterSource !== 'all' && l.source !== s.bulkFilterSource) return false;\n      if (s.bulkFilterStage !== 'all' && l.stage !== s.bulkFilterStage) return false;\n      if (s.bulkFilterOwner !== 'all' && l.ownerId !== s.bulkFilterOwner) return false;\n      return true;\n    });\n  }\n  openBulkConfirm() {\n    const s = this.state;\n    if (!s.bulkChannelEmail && !s.bulkChannelSms) { this.setState({ toast: 'Choose at least one channel.' }); return; }\n    if (!s.bulkMessage.trim()) { this.setState({ toast: 'Write a message first.' }); return; }\n    if (!this.getBulkAudience().length) { this.setState({ toast: 'No leads match this audience.' }); return; }\n    this.setState({ showBulkConfirm: true });\n  }\n  closeBulkConfirm() { this.setState({ showBulkConfirm: false }); }\n  sendBulkMessage() {\n    const s = this.state;\n    const audience = this.getBulkAudience();\n    const cfg = s.integrations;\n    audience.forEach(l => {\n      if (s.bulkChannelEmail && l.email) {\n        console.log('[bulk email stub] would send via', cfg.emailProvider, { to: l.email, subject: s.bulkSubject, body: s.bulkMessage });\n        this.logActivity(l.id, `Bulk email sent: \"${s.bulkSubject || s.bulkMessage.slice(0, 40)}\"`);\n      }\n      if (s.bulkChannelSms && l.phone) {\n        if (cfg.smsProxyUrl.trim()) {\n          this.sendSmsViaProxy(cfg.smsProxyUrl, { to: l.phone, from: cfg.smsFromNumber, body: s.bulkMessage })\n            .then(ok => this.logActivity(l.id, ok ? 'Bulk SMS delivered' : 'Bulk SMS delivery failed'));\n        } else {\n          console.log('[ ed.length)} of ${filtered.length}`;\n    const hasPrevPage = leadsPage > 1;\n    const hasNextPage = leadsPage < totalPages;\n    const showLeadsPagination = filtered.length > PAGE_SIZE;\n\n    const today = new Date(); today.setHours(0,0,0,0);\n    const weekAgo = new Date(today); weekAgo.setDate(weekAgo.getDate() - 7);\n    const newThisWeek = visibleLeads.filter(l => new Date(l.createdAt + 'T00:00:00') >= weekAgo).length;\n    const wonCount = visibleLeads.filter(l => l.stage === 'Won').length;\n    const targetPct = Math.min(100, Math.round((wonCount / monthlyTarget) * 100));\n\n    const goToLeads = (filters) => this.setState({ view: 'leads', mobileTab: 'leads', filterStage: filters.stage || 'all', filterCreatedThisWeek: !!filters.thisWeek, leadsPage: 1 });\n    const statCards = [\n      { label: 'Total Leads', value: visibleLeads.length, onClick: () => goToLeads({}) },\n      { label: 'New This Week', value: newThisWeek, onClick: () => goToLeads({ thisWeek: true }) },\n      { label: 'Won', value: wonCount, onClick: () => goToLeads({ stage: 'Won' }) },\n      { label: 'Target Progress', value: `${targetPct}%`, sub: `${wonCount} / ${monthlyTarget} goal`, progress: true, progressPct: `${targetPct}%`, onClick: () => goToLeads({ stage: 'Won' }) },\n    ];\n\n    const maxSourceCount = Math.max(1, ...ALL_SOURCES.map(src => visibleLeads.filter(l => l.source === src).length));\n    const goToLeadsBySource = (src) => this.setState({ view: 'leads', mobileTab: 'leads', filterSource: src, filterStage: 'all', filterCreatedThisWeek: false, leadsPage: 1 });\n    const sourceStats = ALL_SOURCES.map(src => {\n      const count = visibleLeads.filter(l => l.source === src).length;\n      return { label: src, count, pct: `${Math.round((count / maxSourceCount) * 100)}%`, onClick: () => goToLeadsBySource(src) };\n    });\n\n    const maxStageCount = Math.max(1, ...STAGES.map(st => visibleLeads.filter(l => l.stage === st).length));\n    const goToLeadsByStage = (stage) => this.set
