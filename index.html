st link = document.createElement('a');\n    link.href = URL.createObjectURL(blob);\n    link.download = 'zues-leads-import-template.csv';\n    link.click();\n    URL.revokeObjectURL(link.href);\n  }\n  closeImport() { this.setState({ showImportModal: false }); }\n  dedupeKey(r) {\n    const email = String(r.email ?? '').trim().toLowerCase();\n    if (email) return `email:${email}`;\n    return `name:${String(r.firstName ?? '').trim().toLowerCase()}|${String(r.lastName ?? '').trim().toLowerCase()}|${String(r.school ?? '').trim().toLowerCase()}`;\n  }\n  computeDuplicateGroups(leads) {\n    const map = new Map();\n    leads.forEach(l => {\n      const key = this.dedupeKey(l);\n      if (!map.has(key)) map.set(key, []);\n      map.get(key).push(l);\n    });\n    return [...map.entries()].filter(([, group]) => group.length > 1).map(([key, group]) => ({ key, leads: group }));\n  }\n  mergeLeads(keepId, groupIds) {\n    const removedIds = groupIds.filter(id => id !== keepId);\n    const removed = this.state.leads.filter(l => removedIds.includes(l.id));\n    const mergedActivity = removed.flatMap(l => l.activity || []);\n    const finish = () => {\n      this._skipNextAutoPush = false; // the winner's own change should still push normally\n      if (this._dirtyLeadIds) removedIds.forEach(id => this._dirtyLeadIds.delete(id));\n      this.setState(s => {\n        const leads = s.leads\n          .filter(l => !groupIds.includes(l.id) || l.id === keepId)\n          .map(l => l.id === keepId ? { ...l, activity: [...(l.activity || []), ...mergedActivity, { ts: new Date().toISOString(), text: `Merged ${removed.length} duplicate record${removed.length === 1 ? '' : 's'}` }] } : l);\n        return { leads, toast: `Merged ${removed.length + 1} records into one lead.` };\n      });\n      if (this.toastTimer) clearTimeout(this.toastTimer);\n      this.toastTimer = setTimeout(() => this.setState({ toast: null }), 3200);\n    };\n    // The duplicate-lead trigger in Supabase rejects an al Leads', value: leads.length },\n      { label: 'Won', value: wonCount },\n    ];\n    return { statCards, sourceStats, stageStats, repLeaderboard, lostReasonStats, totalPipelineValue, wonRevenue };\n  }\n  reportExtrasHtml(esc, bar) {\n    const leads = this.state.leads;\n    const now = new Date(); const todayS = this.apptYmd(now); const ym = todayS.slice(0, 7);\n    const monthLabel = now.toLocaleDateString('en-ZA', { month: 'long', year: 'numeric' });\n    const ALL_REPS = this.getAllReps();\n    const repName = id => (ALL_REPS.find(r => r.id === id) || {}).name || id || 'Unassigned';\n    const R = n => 'R' + Math.round(n).toLocaleString('en-ZA');\n    const td = 'padding:7px 9px;font-size:11.5px;border-bottom:1px solid #eef0f4';\n    const card = (label, value, color) => `<div style=\"flex:1;background:#f7f8fb;border:1px solid #e5e8ef;border-radius:10px;padding:12px 14px\"><div style=\"font-size:10.5px;font-weight:700;color:#6b7280;text-transform:uppercase\">${esc(label)}<\u002Fdiv><div style=\"font-size:20px;font-weight:800;margin-top:4px;color:${color || '#111827'}\">${esc(value)}<\u002Fdiv><\u002Fdiv>`;\n    const amt = p => Number(p.amount) || p.lead.value || 0;\n    const ps = this.getAllPromises(leads).filter(p => p.date && p.date.slice(0, 7) === ym && ['pending', 'kept', 'missed'].includes(p.status)).sort((a, b) => a.date.localeCompare(b.date));\n    const eff = p => p.status === 'pending' ? (p.date < todayS ? 'Overdue' : 'Pending') : p.status === 'kept' ? 'Registered' : 'Missed';\n    const effC = { Overdue: '#c2410c', Pending: '#3a5bd9', Registered: '#1a7a3f', Missed: '#b91c1c' };\n    const cnt = k => ps.filter(p => eff(p) === k);\n    const sum = arr => arr.reduce((t, p) => t + amt(p), 0);\n    const closed = cnt('Registered').length + cnt('Missed').length;\n    const pRows = ps.map(p => `<tr><td style=\"${td}\">${esc(new Date(p.date + 'T00:00:00').toLocaleDateString('en-ZA', { day: 'numeric', month: 'short' }))}<\u002Ftd><td style=\"${td}\">${esc
