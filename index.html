document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"ac2b80f1-6945-47bd-b9bd-2792b19f1ff9\"><\u002Fscript>\n\n<\u002Fhead>\n<body>\n<x-dc>\n\n<helmet data-dc-atomics=\"\">\n<link rel=\"icon\" href=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHZpZXdCb3g9JzAgMCA2NCA2NCc+PHJlY3Qgd2lkdGg9JzY0JyBoZWlnaHQ9JzY0JyByeD0nMTQnIGZpbGw9JyMyZjVmZDYnLz48cGF0aCBkPSdNMzIgMTRMMTAgMjRsMjIgMTAgMTYtNy4zVjM4aDRWMjRMMzIgMTR6JyBmaWxsPSd3aGl0ZScvPjxwYXRoIGQ9J00xOCAzMHY5YzAgMy41IDYgNyAxNCA3czE0LTMuNSAxNC03di05bC0xNCA2LjUtMTQtNi41eicgZmlsbD0nd2hpdGUnIG9wYWNpdHk9JzAuODUnLz48L3N2Zz4=\">\n<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">\n<meta name=\"mobile-web-app-capable\" content=\"yes\">\n\n<meta name=\"theme-color\" content=\"oklch(20% 0.03 258)\">\n<script src=\"528d593f-1b26-457a-9d4f-4aecb8a39ba9\"><\u002Fscript>\n<style>\n  body{margin:0;background:oklch(97% 0.006 258);font-family:-apple-system,BlinkMacSystemFont,\"Segoe UI\",Helvetica,Arial,sans-serif;color:oklch(24% 0.02 258)}\n  * { box-sizing: border-box; }\n  input, select, textarea { font-family: inherit; }\n  ::placeholder { color: oklch(60% 0.01 258); }\n  @keyframes modalIn { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }\n  @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }\n  @keyframes splashOut { 0%,70% { opacity:1; } 100% { opacity:0; } }\n  @keyframes splashPulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.06); } }\n  @keyframes skeletonPulse { 0%,100% { opacity:0.55; } 50% { opacity:1; } }\n  @keyframes saveConfirmPop { 0% { transform:translate(-50%,-50%) scale(0.4); opacity:0; } 40% { transform:translate(-50%,-50%) scale(1.08); opacity:1; } 100% { transform:translate(-50%,-50%) scale(1); opacity:1; } }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"width:100%;min-height:100vh;background:oklch(97% 0.006 258);filter:{{ themeFilter }};transition:filter 0.2s ease\">\n\n<sc-if value=\"{{ showSplash }}\" hint-placeholder-val=\"{{ true }}\">\n  <div style=\"position:fixed;inset:0;z-index:100;background:oklch(20% 0.03 258);display:flex;align-items:center;justify-content:center;animation:splashOut 1.1s ease forwards\">\n    <div style=\"display:flex;flex-direction:column;align-items:center;gap:14px;animation:splashPulse 1.1s ease\">\n      <div style=\"width:64px;height:64px;border-radius:16px;background:oklch(66% 0.15 258);display:flex;align-items:center;justify-content:center\"><svg width=\"38\" height=\"38\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M12 3L2 8l10 5 8-4.09V17h2V8L12 3z\" fill=\"white\"><\u002Fpath><path d=\"M6 11.5V16c0 1.5 2.7 3 6 3s6-1.5 6-3v-4.5l-6 3-6-3z\" fill=\"white\" opacity=\"0.85\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n      <div style=\"color:#fff;font-size:22px;font-weight:800;letter-spacing:1px\">ZUES<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ saveConfirmVisible }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:60;width:64px;height:64px;border-radius:50%;background:oklch(60% 0.16 150);color:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;box-shadow:0 10px 30px rgba(0,0,0,0.25);animation:saveConfirmPop 0.5s ease\">✓<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ toast }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position:fixed;top:18px;right:18px;z-index:50;background:oklch(24% 0.03 258);color:#fff;padding:13px 18px;border-radius:9px;font-size:13px;font-weight:600;max-width:320px;box-shadow:0 6px 18px rgba(20,20,40,0.25);animation:fadeIn 0.15s ease\">{{ toast }}<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ hasPendingSync }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:55;background:#1f2430;color:#fff;padding:12px 14px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,0.3);display:flex;align-items:center;gap:12px;max-width:calc(100vw - 24px)\">\n    <div style=\"font-size:13px;font-weight:600;white-space:nowrap\">{{ pendingSyncCount }} unsaved change(s)<\u002Fdiv>\n    <div sc-camel-on-click=\"{{ onSubmitChanges }}\" style=\"background:oklch(58% 0.18 258);color:#fff;font-size:13px;font-weight:700;padding:9px 16px;border-radius:8px;cursor:pointer;min-height:44px;display:flex;align-items:center;white-space:nowrap\">Submit changes<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ showCmdK }}\" hint-placeholder-val=\"{{ false }}\">\n  <div sc-camel-on-click=\"{{ onCloseCmdK }}\" style=\"position:fixed;inset:0;z-index:60;background:rgba(20,24,34,0.5);display:flex;align-items:flex-start;justify-content:center;padding-top:14vh\">\n    <div sc-camel-on-click=\"{{ stopPropagation }}\" style=\"background:#fff;border-radius:12px;width:100%;max-width:520px;margin:0 16px;box-shadow:0 20px 60px rgba(0,0,0,0.3);overflow:hidden\">\n      <input value=\"{{ cmdkQuery }}\" sc-camel-on-change=\"{{ onCmdkQueryChange }}\" sc-camel-auto-focus=\"{{ true }}\" placeholder=\"Search leads by name, email, or school…\" style=\"width:100%;padding:16px 18px;border:none;border-bottom:1px solid oklch(90% 0.01 258);font-size:15px;outline:none;box-sizing:border-box\">\n      <sc-if value=\"{{ cmdkNoResults }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"padding:16px 18px;font-size:13px;color:oklch(55% 0.02 258)\">No leads found.<\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ cmdkHasQuery }}\" hint-placeholder-val=\"{{ false }}\">\n        <sc-for list=\"{{ cmdkResults }}\" as=\"r\" hint-placeholder-count=\"4\">\n          <div sc-camel-on-click=\"{{ r.onClick }}\" style-hover=\"background:oklch(96% 0.008 258)\" style=\"padding:12px 18px;cursor:pointer;border-top:1px solid oklch(95% 0.01 258)\">\n            <div style=\"font-size:13.5px;font-weight:600\">{{ r.name }}<\u002Fdiv>\n            <div style=\"font-size:11.5px;color:oklch(52% 0.02 258)\">{{ r.sub }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isNotAuthenticated }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px\">\n    <div style=\"width:100%;max-width:380px;background:#fff;border:1px solid oklch(90% 0.01 258);border-radius:14px;padding:32px\">\n      <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:26px\">\n        <div style=\"width:30px;height:30px;border-radius:8px;background:oklch(50% 0.16 258);flex:none;display:flex;align-items:center;justify-content:center\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M12 3L2 8l10 5 8-4.09V17h2V8L12 3z\" fill=\"white\"><\u002Fpath><path d=\"M6 11.5V16c0 1.5 2.7 3 6 3s6-1.5 6-3v-4.5l-6 3-6-3z\" fill=\"white\" opacity=\"0.85\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n        <div style=\"font-size:20px;font-weight:800;letter-spacing:0.5px\">ZUES<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:17px;font-weight:700;margin-bottom:4px\">Sign in<\u002Fdiv>\n      <div style=\"font-size:13px;color:oklch(50% 0.02 258);margin-bottom:20px\">Access your sales tracking dashboard<\u002Fdiv>\n\n      <sc-if value=\"{{ showTwoFactorScreen }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"font-size:13px;color:oklch(50% 0.02 258);margin-bottom:16px\">Enter the 6-digit code sent for <strong>{{ twoFactorTargetLabel }}<\u002Fstrong>.<\u002Fdiv>\n        <input value=\"{{ twoFactorInput }}\" sc-camel-on-change=\"{{ onTwoFactorInputChange }}\" placeholder=\"123456\" style=\"width:100%;padding:12px;text-align:center;letter-spacing:6px;font-size:20px;font-weight:700;border:1px solid oklch(88% 0.01 2 lex;justify-content:center\"><\u002Fdiv>\n        <\u002Fsc-if>\n\n        <div style=\"margin-top:20px;padding-top:16px;border-top:1px solid oklch(93% 0.01 258);font-size:11.5px;color:oklch(55% 0.02 258)\">\n          Ask your manager for your username and password.\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isSignupMode }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"font-size:13px;color:oklch(50% 0.02 258);margin-bottom:16px\">Request a rep account — your manager will review and approve it before you can sign in.<\u002Fdiv>\n        <div style=\"margin-bottom:12px\">\n          <div style=\"font-size:12px;font-weight:600;color:oklch(45% 0.02 258);margin-bottom:5px\">Full name<\u002Fdiv>\n          <input value=\"{{ signupName }}\" sc-camel-on-change=\"{{ onSignupNameChange }}\" placeholder=\"e.g. Naledi Mabaso\" style=\"width:100%;padding:10px 12px;border:1px solid oklch(88% 0.01 258);border-radius:8px;font-size:14px\">\n        <\u002Fdiv>\n        <div style=\"margin-bottom:12px\">\n          <div style=\"font-size:12px;font-weight:600;color:oklch(45% 0.02 258);margin-bottom:5px\">Username<\u002Fdiv>\n          <input value=\"{{ signupUsername }}\" sc-camel-on-change=\"{{ onSignupUsernameChange }}\" placeholder=\"e.g. naledi\" style=\"width:100%;padding:10px 12px;border:1px solid oklch(88% 0.01 258);border-radius:8px;font-size:14px\">\n        <\u002Fdiv>\n        <div style=\"margin-bottom:12px\">\n          <div style=\"font-size:12px;font-weight:600;color:oklch(45% 0.02 258);margin-bottom:5px\">Email<\u002Fdiv>\n          <input value=\"{{ signupEmail }}\" sc-camel-on-change=\"{{ onSignupEmailChange }}\" placeholder=\"e.g. naledi@zues.com\" style=\"width:100%;padding:10px 12px;border:1px solid oklch(88% 0.01 258);border-radius:8px;font-size:14px\">\n        <\u002Fdiv>\n        <div style=\"margin-bottom:8px\">\n          <div style=\"font-size:12px;font-weight:600;color:oklch(45% 0.02 258);margin-bottom:5px\">Password<\u002Fdiv>\n          <input type=\"password\" value=\"{{ signupPassword }}\" sc-camel-on-change=\"{{ onSignupPasswordChange }}\" placeholder=\"••••••••\" style=\"width:100%;padding:10px 12px;border:1px solid oklch(88% 0.01 258);border-radius:8px;font-size:14px\">\n          <div style=\"font-size:11.5px;color:oklch(55% 0.02 258);margin-top:5px\">At least 8 characters, with letters and numbers.<\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ signupError }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"font-size:12.5px;color:oklch(52% 0.15 25);margin-bottom:10px\">{{ signupError }}<\u002Fdiv>\n        <\u002Fsc-if>\n        <div sc-camel-on-click=\"{{ handleSignup }}\" style=\"margin-top:8px;background:oklch(50% 0.16 258);color:#fff;text-align:center;padding:11px;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;margin-bottom:12px\">Request account<\u002Fdiv>\n        <div sc-camel-on-click=\"{{ backToSignIn }}\" style=\"text-align:center;font-size:12.5px;font-weight:600;color:oklch(45% 0.02 258);cursor:pointer\">Back to sign in<\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isForgotMode }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"font-size:13px;color:oklch(50% 0.02 258);margin-bottom:16px\">Enter your username or email and we'll send a password reset link.<\u002Fdiv>\n        <div style=\"margin-bottom:14px\">\n          <div style=\"font-size:12px;font-weight:600;color:oklch(45% 0.02 258);margin-bottom:5px\">Username or email<\u002Fdiv>\n          <input value=\"{{ recoveryInput }}\" sc-camel-on-change=\"{{ onRecoveryInputChange }}\" placeholder=\"Your username or email\" style=\"width:100%;padding:10px 12px;border:1px solid oklch(88% 0.01 258);border-radius:8px;font-size:14px\">\n        <\u002Fdiv>\n        <div sc-camel-on-click=\"{{ submitRecovery }}\" style=\"background:oklch(50% 0.16 258);color:#fff;text-align:center;padding:11px;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;margin-bottom:12px\">Send reset link<\u002Fdiv>\n        <div sc-camel-on-click=\"{{ backToSignIn }}\" style=\"text-align:center;font-size:12.5px;font-weight:600;color:oklch(45% 0.02 258);cursor:pointer\">Back to sign in<\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isSentMode }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"font-size:13.5px;color:oklch(30% 0.02 258);line-height:1.6;margin-bottom:18px\">If an account matches <strong>{{ recoveryInput }}<\u002Fstrong>, we've sent a password reset link to the email on file.<\u002Fdiv>\n        <div sc-camel-on-click=\"{{ backToSignIn }}\" style=\"background:oklch(50% 0.16 258);color:#fff;text-align:center;padding:11px;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer\">Back to sign in<\u002Fdiv>\n      <\u002Fsc-if>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isAuthenticated }}\" hint-placeholder-val=\"{{ false }}\">\n<sc-if value=\"{{ isNotMobile }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"display:flex;min-height:100vh\">\n\n  <div style=\"width:232px;flex:none;background:oklch(20% 0.03 258);display:flex;flex-direction:column;padding:20px 14px;gap:4px\">\n    <div style=\"display:flex;align-items:center;gap:10px;padding:8px 10px 22px 10px;cursor:pointer\" sc-camel-on-click=\"{{ onGoToDashboard }}\">\n      <div style=\"width:30px;height:30px;border-radius:8px;background:oklch(66% 0.15 258);flex:none;display:flex;align-items:center;justify-content:center\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M12 3L2 8l10 5 8-4.09V17h2V8L12 3z\" fill=\"white\"><\u002Fpath><path d=\"M6 11.5V16c0 1.5 2.7 3 6 3s6-1.5 6-3v-4.5l-6 3-6-3z\" fill=\"white\" opacity=\"0.85\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n      <div style=\"color:#fff;font-size:19px;font-weight:800;letter-spacing:0.8px\">ZUES<\u002Fdiv>\n    <\u002Fdiv>\n\n    <sc-for list=\" "6\"><option value=\"{{ o.value }}\">{{ o.label }}<\u002Foption><\u002Fsc-for>\n        <\u002Fsc-raw-select>\n        <sc-if value=\"{{ filterCreatedThisWeek }}\" hint-placeholder-val=\"{{ false }}\">\n          <div sc-camel-on-click=\"{{ onClearThisWeekFilter }}\" style=\"display:flex;align-items:center;gap:6px;padding:10px 12px;border-radius:999px;background:oklch(50% 0.16 258);color:#fff;font-size:12.5px;font-weight:600;cursor:pointer\">New this week ✕<\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-raw-select value=\"{{ leadsSort }}\" sc-camel-on-change=\"{{ onLeadsSortChange }}\" style=\"padding:10px 12px;border:1px solid oklch(88% 0.01 258);border-radius:8px;font-size:13px;background:#fff\">\n          <option value=\"default\">Default order<\u002Foption>\n          <option value=\"name_asc\">Name (A–Z)<\u002Foption>\n          <option value=\"name_desc\">Name (Z–A)<\u002Foption>\n          <option value=\"school_asc\">School (A–Z)<\u002Foption>\n          <option value=\"school_desc\">School (Z–A)<\u002Foption>\n          <option value=\"stage\">Stage (pipeline order)<\u002Foption>\n        <\u002Fsc-raw-select>\n        <sc-if value=\"{{ isManagerRole }}\" hint-placeholder-val=\"{{ false }}\">\n          <sc-raw-select value=\"{{ filterOwner }}\" sc-camel-on-change=\"{{ onFilterOwnerChange }}\" style=\"padding:10px 12px;border:1px solid oklch(88% 0.01 258);border-radius:8px;font-size:13px;background:#fff\">\n            <sc-for list=\"{{ ownerFilterOptions }}\" as=\"o\" hint-placeholder-count=\"5\"><option value=\"{{ o.value }}\">{{ o.label }}<\u002Foption><\u002Fsc-for>\n          <\u002Fsc-raw-select>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <div style=\"background:#fff;border:1px solid oklch(90% 0.01 258);border-radius:10px;overflow-y:auto;overflow-x:hidden;max-height:calc(100vh - 260px)\">\n        <sc-if value=\"{{ showBulkReassignBar }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;align-items:center;gap:10px;p l }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div sc-camel-on-click=\"{{ row.onResetPassword }}\" style=\"font-size:12.5px;font-weight:600;color:oklch(50% 0.16 258);cursor:pointer;white-space:nowrap\">Reset password<\u002Fdiv>\n            <div sc-camel-on-click=\"{{ row.onRemove }}\" style=\"font-size:12.5px;font-weight:600;color:oklch(52% 0.15 25);cursor:pointer;white-space:nowrap\">Remove<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <sc-if value=\"{{ teamRowsEmpty }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"padding:20px 16px;font-size:12.5px;color:oklch(55% 0.02 258)\">No rep accounts created yet.<\u002Fdiv><\u002Fsc-if>\n      <\u002Fdiv>\n\n      <div style=\"max-width:640px;background:#fff;border:1px solid oklch(90% 0.01 258);border-radius:10px;overflow:hidden;margin-top:16px\">\n        <div style=\"padding:12px 16px;font-size:12px;font-weight:700;color:oklch(48% 0.02 258);text-transform:uppercase;background:oklch(96% 0.006 258)\">Monthly targets (leads won)<\u002Fdiv>\n        <sc-for list=\"{{ repTargetRows }}\" as=\"rt\" hint-placeholder-count=\"4\">\n          <div style=\"padding:11px 16px;border-top:1px solid oklch(94% 0.01 258)\">\n            <div style=\"font-size:13.5px;font-weight:600;margin-bottom:8px\">{{ rt.name }}<\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(6,1fr);gap:6px\">\n              <sc-for list=\"{{ rt.months }}\" as=\"m\" hint-placeholder-count=\"12\">\n                <div>\n                  <div style=\"font-size:10px;color:oklch(55% 0.02 258);margin-bottom:2px;text-align:center\">{{ m.label }}<\u002Fdiv>\n                  <input type=\"number\" min=\"0\" value=\"{{ m.value }}\" sc-camel-on-change=\"{{ m.onChange }}\" style=\"width:100%;padding:6px 4px;border:1px solid oklch(88% 0.01 258);border-radius:6px;font-size:12px;text-align:center\">\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;gap:16px;margin-top:16px;flex-wrap:wrap\">\n        <div sc-camel-on-click=\"{{ onResetTeamAndRules }}\" style=\"font-size:12.5px;font-weight:600;color:oklch(50% 0.16 258);cursor:pointer\">Reset team &amp; rules to defaults<\u002Fdiv>\n        <div sc-camel-on-click=\"{{ onReapplyAssignmentRules }}\" style=\"font-size:12.5px;font-weight:600;color:oklch(50% 0.16 258);cursor:pointer\">Re-apply assignment rules to all leads<\u002Fdiv>\n        <div sc-camel-on-click=\"{{ onMergeSimilarSchools }}\" style=\"font-size:12.5px;font-weight:600;color:oklch(50% 0.16 258);cursor:pointer\">Merge similar school names<\u002Fdiv>\n        <div sc-camel-on-click=\"{{ onResetSampleData }}\" style=\"font-size:12.5px;font-weight:600;color:oklch(52% 0.15 25);cursor:pointer\">Remove all leads<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isBulk }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"max-width:640px;background:#fff;border:1px solid oklch(90% 0.01 258);border-radius:10px;padding:22px\">\n        <div style=\"font-size:14px;font-weight:700;margin-bottom:4px\">Audience<\u002Fdiv>\n        <div style=\"font-size:12.5px;color:oklch(50% 0.02 258);margin-bottom:14px\">Send to the entire database or filter down to a segment.<\u002Fdiv>\n        <div style=\"display:flex;gap:8px;margin-bottom:16px\">\n          <div sc-camel-on-click=\"{{ onBulkAudienceAll }}\" style=\"flex:1;text-align:center;padding:10px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;background:{{ bulkIsAll_bg }};color:{{ bulkIsAll_fg }};border:1px solid oklch(88% 0.01 258)\">Entire database<\u002Fdiv>\n          <div sc-camel-on-click=\"{{ onBulkAudienceCustom }}\" style=\"flex:1;text-align:center;padding:10px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;background:{{ bulkIsCustom_bg }};color:{{ bulkIsCustom_fg }};border:1px solid oklch(88% 0.01 258)\">Custom segment<\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ bulkIsCustom }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px\">\n            <sc-raw-select value=\"{{ bulkFilterSource }}\" sc-camel-on-change=\"{{ onBulkFilterSourceChange }}\" style=\"padding:9px 10px;border:1px solid oklch(88% 0.01 258);border-radius:7px;font-size:13px;background:#fff\">\n              <sc-for list=\"{{ sourceFilterOptions }}\" as=\"o\" hint-placeholder-count=\"8\"><option value=\"{{ o.value }}\">{{ o.label }}<\u002Foption><\u002Fsc-for>\n            <\u002Fsc-raw-select>\n            <sc-raw-select value=\"{{ bulkFilterStage }}\" sc-camel-on-change=\"{{ onBulkFilterStageChange }}\" style=\"padding:9px 10px;border:1px solid oklch(88% 0.01 258);border-radius:7px;font-size:13px;background:#fff\">\n              <sc-for list=\"{{ stageFilterOptions }}\" as=\"o\" hint-placeholder-count=\"6\"><option value=\"{{ o.value }}\">{{ o.label }}<\u002Foption><\u002Fsc-for>\n            <\u002Fsc-raw-select>\n            <sc-raw-select value=\"{{ bulkFilterOwner }}\" sc-camel-on-change=\"{{ onBulkFilterOwnerChange }}\" style=\"padding:9px 10px;border:1px solid oklch(88% 0.01 258);border-radius:7px;font-size:13px;background:#fff\">\n              <sc-for list=\"{{ ownerFilterOptions }}\" as=\"o\" hint-placeholder-count=\"5\"><option value=\"{{ o.value }}\">{{ o.label }}<\u002Foption><\u002Fsc-for>\n            <\u002Fsc-raw-select>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <div style=\"font-size:12.5px;color:oklch(45% 0.02 258);font-weight:600;margin-bottom:18px\">{{ bulkAudienceCount }} lead(s) match this audience.<\u002Fdiv>\n\n        <div style=\"font-size:14px;font-weight:700;margin-bottom:10px\">Channels<\u002Fdiv>\n        <div style=\"display:flex;gap:16px;margin-bottom:18px\">\n          <label style=\"display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;padding:8px 0;min-height:44px;box-sizing:border-box\"><input type=\"checkbox\" checked=\"{{ bulkChannelEmail }}\" sc-camel-on-change=\"{{ onToggleBulkEmail }}\">Email<\u002Flabel>\n          <label style=\"display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;padding:8px 0;min-height:44px;box-sizing:border-box\"><input type=\"checkbox\" checked=\"{{ bulkChannelSms }}\" sc-camel-on-change=\"{{ onToggleBulkSms }}\">SMS<\u002Flabel>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ bulkChannelEmail }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"font-size:12px;font-weight:600;color:oklch(45% 0.02 258);margin-bottom:5px\">Subject (email)<\u002Fdiv>\n          <input value=\"{{ bulkSubject }}\" sc-camel-on-change=\"{{ onBulkSubjectChange }}\" placeholder=\"e.g. Fall enrollment now open\" style=\"width:100%;padding:9px 11px;border:1px solid oklch(88% 0.01 258);border-radius:7px;font-size:13.5px;margin-bottom:14px\">\n        <\u002Fsc-if>\n        <div style=\"font-size:12px;font-weight:600;color:oklch(45% 0.02 258);margin-bottom:5px\">Message<\u002Fdiv>\n        <textarea value=\"{{ bulkMessage }}\" sc-camel-on-change=\"{{ onBulkMessageChange }}\" rows=\"5\" placeholder=\"Write your message…\" style=\"width:100%;padding:11px 12px;box-sizing:border-box;border:1px solid oklch(88% 0.01 258);border-radius:7px;font-size:14px;resize:vertical;margin-bottom:18px\"><\u002Ftextarea>\n        <div sc-camel-on-click=\"{{ onSendBulkMessage }}\" style=\"display:inline-block;background:oklch(50% 0.16 258);color:#fff;font-size:13.5px;font-weight:600;padding:11px 20px;border-radius:8px;cursor:pointer\">Send to {{ bulkAudienceCount }} lead(s)<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isIntegrations }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"background:#fff;border:1px solid oklch(90% 0.01 258);border-radius:10px;padding:20px;max-width:920px;margin-bottom:16px\">\n        <sc-if value=\"{{ supabaseQuotaExceeded }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"background:oklch(96% 0.05 70);border:1px solid oklch(80% 0.12 70);color:oklch(38% 0.1 60);border-radius:8px;padding:10px 12px;font-size:12.5px;font-weight:600;margin-bottom:12px\">⚠ Firebase's free daily write quota is used up — syncs will fail until it resets (~24h) or you upgrade the project to the Blaze plan.<\u002Fdiv>\n        <\u002Fsc-if>\n        <div style=\"display:flex;align-items:baseline;justify-content:space-between;margin-bottom:4px\"><div style=\"font-size:14px;font-weight:700\">Backend — Supabase (recommended)<\u002Fdiv><div style=\"background:oklch(93% 0.1 145);color:oklch(38% 0.13 145);font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px\">Faster &amp; reliable at scale<\u002Fdiv><\u002Fdiv>\n        <div style=\"font-size:12.5px;color:oklch(50% 0.02 258);margin-bottom:14px\">Each lead is its own record — an assignment change only writes what changed, instead of rewriting your whole dataset every time (which is what caused the Sheets sync failures).<\u002Fdiv>\n        <div style=\"display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px\">\n          <div sc-camel-on-click=\"{{ onPushAllToSupabase }}\" style=\"background:oklch(50% 0.16 258);color:#fff;font-size:12.5px;font-weight:600;padding:8px 14px;border-radius:7px;cursor:pointer\">Migrate all leads to Supabase<\u002Fdiv>\n          <div sc-camel-on-click=\"{{ onLoadFromSupabase }}\" style=\"background:oklch(94% 0.008 258);color:oklch(38% 0.02 258);font-size:12.5px;font-weight:600;padding:8px 14px;border-radius:7px;cursor:pointer\">Load leads from Supabase<\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ hasSupabaseStatus }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:12px;color:oklch(45% 0.02 258)\">{{ supabaseStatus }}<\u002Fdiv><\u002Fsc-if>\n        <sc-if value=\"{{ supabaseSyncing }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:12px;color:oklch(50% 0.16 258);font-weight:600;margin-top:4px\">⏳ {{ supabaseSyncLabel }}<\u002Fdiv><\u002Fsc-if>\n        <sc-if value=\"{{ hasSupabaseLastSync }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:11.5px;color:oklch(55% 0.02 258);margin-top:4px\">Last synced {{ supabaseLastSync }}<\u002Fdiv><\u002Fsc-if>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ false }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"background:#fff;border:1px solid oklch(90% 0.01 258);border-radius:10px;padding:20px;max-width:920px;margin-bottom:16px\">\n        <div style=\"display:none;font-size:14px;font-weight:700;margin-bottom:4px\">Backend — Google Sheets<\u002Fdiv>\n        <div style=\"display:none;font-size:12.5px;color:oklch(50% 0.02 258);margin-bottom:14px\">Lowest-cost real backend: a Google Sheet + a free Apps Script Web App acting as the API. Download the script below, paste it into your Sheet's Apps Script editor, deploy as a Web App (\"Anyone\" access), then paste the deployment URL here.<\u002Fdiv>\n        <div style=\"font-size:12px;font-weight:600;color:oklch(45% 0.02 258);margin-bottom:5px\">Web App URL<\u002Fdiv>\n        <input value=\"{{ sheetsApiUrl }}\" sc-camel-on-change=\"{{ onSheetsApiUrlChange }}\" placeholder=\"https://script.google.com/macros/s/…/exec\" style=\"width:100%;padding:9px 11px;border:1px solid oklch(88% 0.01 258);border-radius:7px;font-size:13.5px;margin-bottom:12px\">\n        <div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px\">\n          <div sc-camel-on-click=\"{{ onDownloadAppsScript }}\" style=\"background:#fff;border:1px solid oklch(88% 0.01 258);color:oklch(40% 0.02 258);font-size:12.5px;font-weight:600;padding:8px 14px;border-radius:7px;cursor:pointer;white-space:nowrap\">Download setup script (.gs)<\u002Fdiv>\n          <div sc-camel-on-click=\"{{ onTestSheetsConnection }}\" style=\"background:#fff;border:1px solid oklch(88% 0.01 258);color:oklch(40% 0.02 258);font-size:12.5px;font-weight:600;padding:8px 14px;border-radius:7px;cursor:pointer;white-space:nowrap\">Test connection<\u002Fdiv>\n          <div sc-camel-on-click=\"{{ onPushToSheets }}\" style=\"background:oklch(50% 0.16 258);color:#fff;font-size:12.5px;font-weight:600;padding:8px 14px;border-radius:7px;cursor:pointer;white-space:nowrap\">Push leads to Sheet<\u002Fdiv>\n          <div sc-camel-on-click=\"{{ onLoadFromSheets }}\" style=\"background:oklch(94% 0.008 258);color:oklch(38% 0.02 258);font-size:12.5px;font-weight:600;padding:8px 14px;border-radius:7px;cursor:pointer;white-space:nowrap\">Load leads from Sheet<\u002Fdiv>\n        <\u002Fdiv>\n        <label style=\"display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;margin-bottom:10px\"><input type=\"checkbox\" checked=\"{{ sheetsAutoSync }}\" sc-camel-on-change=\"{{ onToggleSheetsAutoSync }}\">Auto-push on every change<\u002Flabel>\n        <sc-if value=\"{{ hasSheetsStatus }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:12px;color:oklch(45% 0.02 258)\">{{ sheetsStatus }}<\u002Fdiv><\u002Fsc-if>\n        <sc-if value=\"{{ sheetsSyncing }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:12px;color:oklch(50% 0.16 258);font-weight:600;margin-top:4px\">⏳ {{ sheetsSyncLabel }}<\u002Fdiv><\u002Fsc-if>\n        <sc-if value=\"{{ hasSheetsLastSync }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:11.5px;color:oklch(55% 0.02 258);margin-top:4px\">Last synced {{ sheetsLastSync }}<\u002Fdiv><\u002Fsc-if>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <div style=\"background:#fff;border:1px solid oklch(90% 0.01 258);border-radius:10px;padding:20px;max-width:920px;margin-bottom:16px\">\n        <div style=\"font-size:14px;font-weight:700;margin-bottom:4px\">Google Sign-In<\u002Fdiv>\n        <div style=\"font-size:12.5px;color:oklch(50% 0.02 258);margin-bottom:14px\">Lets reps sign in with their Google account (matched by email to existing accounts, or auto-created). Needs a real OAuth Client ID from Google Cloud Console with this app's deployed domain authorized as a JavaScript origin — won't work from this preview's rotating URL, only once deployed to a fixed domain. For real security also verify the ID token server-side.<\u002Fdiv>\n        <div style=\"font-size:12px;font-weight:600;color:oklch(45% 0.02 258);margin-bottom:5px\">OAuth Client ID<\u002Fdiv>\n        <input value=\"{{ googleClientId }}\" sc-camel-on-change=\"{{ onGoogleClientIdChange }}\" placeholder=\"xxxxxxxx.apps.googleusercontent.com\" style=\"width:100%;padding:9px 11px;border:1px solid oklch(88% 0.01 258);border-radius:7px;font-size:13.5px\">\n      <\u002Fdiv>\n\n      <div style=\"background:#fff;border:1px solid oklch(90% 0.01 258);border-radius:10px;padding:20px;max-width:920px;margin-bottom:16px\">\n        <div style=\"font-size:14px;font-weight:700;margin-bottom:4px\">Two-factor login<\u002Fdiv>\n        <div style=\"font-size:12.5px;color:oklch(50% 0.02 258);margin-bottom:14px\">Requires a 6-digit code after username/password. Demo mode logs the code to the console (and texts it if an SMS proxy is configured above) — no real delivery is guaranteed without one.<\u002Fdiv>\n        <label style=\"display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer\"><input type=\"checkbox\" checked=\"{{ twoFactorEnabled }}\" sc-camel-on-change=\"{{ onToggleTwoFactorEnabled }}\">Require two-factor login for all accounts<\u002Flabel>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:920px\">\n        <div style=\"background:#fff;border:1px solid oklch(90% 0.01 258);border-radius:10px;padding:20px\">\n          <div style=\"font-size:14px;font-weight:700;margin-bottom:4px\">Webhook<\u002Fdiv>\n          <div style=\"font-size:12.5px;color:oklch(50% 0.02 258);margin-bottom:14px\">Fire an HTTP POST to your endpoint on lead events. This is a stub — payloads are logged to the console instead of sent.<\u002Fdiv>\n          <div style=\"font-size:12px;font-weight:600;color:oklch(45% 0.02 258);margin-bottom:5px\">Endpoint URL<\u002Fdiv>\n          <input value=\"{{ integrationsWebhookUrl }}\" sc-camel-on-change=\"{{ onWebhookUrlChange }}\" placeholder=\"https://your-app.com/webhooks/zues\" style=\"width:100%;padding:9px 11px;border:1px solid oklch(88% 0.01 258);border-radius:7px;font-size:13.5px;margin-bottom:14px\">\n          <div style=\"font-size:12px;font-weight:700;color:oklch(48% 0.02 258);text-transform:uppercase;margin-bottom:8px\">Trigger on<\u002Fdiv>\n          <label style=\"display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:8px;cursor:pointer\"><input type=\"checkbox\" checked=\"{{ webhookOnCreate }}\" sc-camel-on-change=\"{{ onToggleWebhookOnCreate }}\">Lead created<\u002Flabel>\n          <label style=\"display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:8px;cursor:pointer\"><input type=\"checkbox\" checked=\"{{ webhookOnStageChange }}\" sc-camel-on-change=\"{{ onToggleWebhookOnStageChange }}\">Pipeline stage changed<\u002Flabel>\n          <label style=\"display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:16px;cursor:pointer\"><input type=\"checkbox\" checked=\"{{ webhookOnReminder }}\" sc-camel-on-change=\"{{ onToggleWebhookOnReminder }}\">Reminder sent<\u002Flabel>\n          <div sc-camel-on-click=\"{{ onTestWebhook }}\" style=\"display:inline-block;background:oklch(50% 0.16 258);color:#fff;font-size:13px;font-weight:600;padding:9px 16px;border-radius:7px;cursor:pointer\">Send test webhook<\u002Fdiv>\n          <sc-if value=\"{{ hasLastTestPayload }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font-size:11px;color:oklch(52% 0.02 258);margin:12px 0 6px\">Last sent {{ lastTestAt }}:<\u002Fdiv>\n            <pre style=\"background:oklch(97% 0.006 258);border:1px solid oklch(90% 0.01 258);border-radius:7px;padding:10px;font-size:11.5px;overflow-x:auto;white-space:pre-wrap\">{{ lastTestPayload }}<\u002Fpre>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid oklch(90% 0.01 258);border-radius:10px;padding:20px\">\n          <div style=\"font-size:14px;font-weight:700;margin-bottom:4px\">Email provider<\u002Fdiv>\n          <div style=\"font-size:12.5px;color:oklch(50% 0.02 258);margin-bottom:14px\">Connect a transactional email provider. This is a stub — no messages leave the app yet.<\u002Fdiv>\n          <div style=\"font-size:12px;font-weight:600;color:oklch(45% 0.02 258);margin-bottom:5px\">Provider<\u002Fdiv>\n          <sc-raw-select value=\"{{ emailProvider }}\" sc-camel-on-change=\"{{ onEmailProviderChange }}\" style=\"width:100%;padding:9px 11px;border:1px solid oklch(88% 0.01 258);border-radius:7px;font-size:13.5px;background:#fff;margin-bottom:14px\">\n            <sc-for list=\"{{ emailProviderOptions }}\" as=\"o\" hint-placeholder-count=\"4\"><option value=\"{{ o.value }}\">{{ o.label }}<\u002Foption><\u002Fsc-for>\n          <\u002Fsc-raw-select>\n          <div style=\"font-size:12px;font-weight:600;color:oklch(45% 0.02 258);margin-bottom:5px\">API key<\u002Fdiv>\n          <input type=\"password\" value=\"{{ emailApiKey }}\" sc-camel-on-change=\"{{ onEmailApiKeyChange }}\" placeholder=\"sk_live_…\" style=\"width:100%;padding:9px 11px;border:1px solid oklch(88% 0.01 258);border-radius:7px;font-size:13.5px;margin-bottom:14px\">\n          <div style=\"font-size:12px;font-weight:600;color:oklch(45% 0.02 258);margin-bottom:5px\">From address<\u002Fdiv>\n          <input value=\"{{ emailFromAddress }}\" sc-camel-on-change=\"{{ onEmailFromAddressChange }}\" style=\"width:100%;padding:9px 11px;border:1px solid oklch(88% 0.01 258);border-radius:7px;font-size:13.5px;margin-bottom:16px\">\n          <div sc-camel-on-click=\"{{ onTestEmail }}\" style=\"display:inline-block;background:#fff;border:1px solid oklch(88% 0.01 258);color:oklch(40% 0.02 258);font-size:13px;font-weight:600;padding:9px 16px;border-radius:7px;cursor:pointer\">Send test email<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid oklch(90% 0.01 258);border-radius:10px;padding:20px\">\n          <div style=\"font-size:14px;font-weight:700;margin-bottom:4px\">SMS provider<\u002Fdiv>\n          <div style=\"font-size:12.5px;color:oklch(50% 0.02 258);margin-bottom:14px\">Real credentials can't live in this client-side app. Point this at a backend/serverless proxy that holds your Twilio (or other) credentials and relays the message — leave the URL blank to keep this a logged-only stub.<\u002Fdiv>\n          <div style=\"font-size:12px;font-weight:600;color:oklch(45% 0.02 258);margin-bottom:5px\">Proxy endpoint URL<\u002Fdiv>\n          <input value=\"{{ smsProxyUrl }}\" sc-camel-on-change=\"{{ onSmsProxyUrlChange }}\" placeholder=\"https://your-backend.com/api/send-sms\" style=\"width:100%;padding:9px 11px;border:1px solid oklch(88% 0.01 258);border-radius:7px;font-size:13.5px;margin-bottom:14px\">\n          <div style=\"font-size:12px;font-weight:600;color:oklch(45% 0.02 258);margin-bottom:5px\">Provider<\u002Fdiv>\n          <sc-raw-select value=\"{{ smsProvider }}\" sc-camel-on-change=\"{{ onSmsProviderChange }}\" style=\"width:100%;padding:9px 11px;border:1px solid oklch(88% 0.01 258);border-radius:7px;font-size:13.5px;background:#fff;margin-bottom:14px\">\n            <sc-for list=\"{{ smsProviderOptions }}\" as=\"o\" hint-placeholder-count=\"3\"><option value=\"{{ o.value }}\">{{ o.label }}<\u002Foption><\u002Fsc-for>\n          <\u002Fsc-raw-select>\n          <div style=\"font-size:12px;font-weight:600;color:oklch(45% 0.02 258);margin-bottom:5px\">API key (stub mode only)<\u002Fdiv>\n          <input type=\"password\" value=\"{{ smsApiKey }}\" sc-camel-on-change=\"{{ onSmsApiKeyChange }}\" placeholder=\"sk_live_…\" style=\"width:100%;padding:9px 11px;border:1px solid oklch(88% 0.01 258);border-radius:7px;font-size:13.5px;margin-bottom:14px\">\n          <div style=\"font-size:12px;font-weight:600;color:oklch(45% 0.02 258);margin-bottom:5px\">From number<\u002Fdiv>\n          <input value=\"{{ smsFromNumber }}\" sc-camel-on-change=\"{{ onSmsFromNumberChange }}\" placeholder=\"+1 555 0100\" style=\"width:100%;padding:9px 11px;border:1px solid oklch(88% 0.01 258);border-radius:7px;font-size:13.5px;margin-bottom:16px\">\n          <div sc-camel-on-click=\"{{ onTestSms }}\" style=\"display:inline-block;background:#fff;border:1px solid oklch(88% 0.01 258);color:oklch(40% 0.02 258);font-size:13px;font-weight:600;padding:9px 16px;border-radius:7px;cursor:pointer\">Send test SMS<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid oklch(90% 0.01 258);border-radius:10px;padding:20px\">\n          <div style=\"font-size:14px;font-weight:700;margin-bottom:4px\">WhatsApp delivery<\u002Fdiv>\n          <div style=\"font-size:12.5px;color:oklch(50% 0.02 258);margin-bottom:14px\">wa.me links open WhatsApp but can't confirm delivery. Point this at a WhatsApp Business API proxy to log real delivery status — leave blank to just log that the chat was opened.<\u002Fdiv>\n          <div style=\"font-size:12px;font-weight:600;color:oklch(45% 0.02 258);margin-bottom:5px\">Proxy endpoint URL<\u002Fdiv>\n          <input value=\"{{ whatsappProxyUrl }}\" sc-camel-on-change=\"{{ onWhatsappProxyUrlChange }}\" placeholder=\"https://your-backend.com/api/send-whatsapp\" style=\"width:100%;padding:9px 11px;border:1px solid oklch(88% 0.01 258);border-radius:7px;font-size:13.5px\">\n        <\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid oklch(90% 0.01 258);border-radius:10px;padding:20px\">\n          <div style=\"font-size:14px;font-weight:700;margin-bottom:4px\">Browser notifications<\u002Fdiv>\n          <div style=\"font-size:12.5px;color:oklch(50% 0.02 258);margin-bottom:14px\">Show a native browser notification when a follow-up is due or overdue, on top of the in-app reminder.<\u002Fdiv>\n          <label style=\"display:flex;align-items: nce:<\u002Fstrong> {{ bulkAudienceLabel }} ({{ bulkAudienceCount }} leads)<\u002Fdiv>\n        <div><strong>Channels:<\u002Fstrong> {{ bulkChannelsLabel }}<\u002Fdiv>\n        <div><strong>Message:<\u002Fstrong> {{ bulkMessage }}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:8px\">\n        <div sc-camel-on-click=\"{{ onCloseBulkConfirm }}\" style=\"flex:1;text-align:center;background:#fff;border:1px solid oklch(88% 0.01 258);color:oklch(40% 0.02 258);font-size:13px;font-weight:600;padding:11px;min-height:44px;box-sizing:border-box;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center\">Cancel<\u002Fdiv>\n        <div sc-camel-on-click=\"{{ onConfirmBulkSend }}\" style=\"flex:1;text-align:center;background:oklch(50% 0.16 258);color:#fff;font-size:13px;font-weight:600;padding:11px;min-height:44px;box-sizing:border-box;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center\">Send to {{ bulkAudienceCount }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ showCallOutcomePrompt }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position:fixed;inset:0;background:rgba(15,20,35,0.45);display:flex;align-items:center;justify-content:center;z-index:30;padding:16px;animation:fadeIn 0.15s ease\">\n    <div style=\"background:#fff;border-radius:14px;width:100%;max-width:400px;padding:22px;animation:modalIn 0.18s ease\">\n      <div style=\"font-size:16px;font-weight:700;margin-bottom:4px\">Call outcome<\u002Fdiv>\n      <div style=\"font-size:12.5px;color:oklch(50% 0.02 258);margin-bottom:14px\">How did the call with {{ callOutcomeLeadName }} go?<\u002Fdiv>\n      <textarea value=\"{{ callOutcomeDraft }}\" sc-camel-on-change=\"{{ onCallOutcomeChange }}\" rows=\"3\" sc-camel-auto-focus=\"{{ true }}\" placeholder=\"e.g. Left voicemail, interested in Fall intake…\" style=\"width:100%;padding:11px 12px;box-sizing:border-box;border:1px solid (this.toastTimer) clearTimeout(this.toastTimer);\n      this.toastTimer = setTimeout(() => this.setState({ toast: null }), 3200);\n    };\n    // The duplicate-lead trigger in Supabase rejects any insert/update whose email\n    // matches an existing row — so the losing rows must actually be deleted server-side\n    // BEFORE the winner's update is pushed, or the trigger sees both still present and\n    // (correctly) blocks it. Delete first, then apply the local merge.\n    if (this.state.integrations.supabaseEnabled && removedIds.length) {\n      this.deleteLeadsFromSupabase(removedIds).then(finish).catch(finish);\n    } else {\n      finish();\n    }\n  }\n  mergeAllDuplicates() {\n    const groups = this.computeDuplicateGroups(this.state.leads);\n    if (!groups.length) return;\n    if (!window.confirm(`Merge all ${groups.length} duplicate group(s)? For each, the record with the most activity is kept and the rest are removed. This cannot be undone.`)) return;\n    let leads = this.state.leads;\n    let removedTotal = 0;\n    const allRemovedIds = [];\n    groups.forEach(g => {\n      const groupIds = g.leads.map(x => x.id);\n      const groupLeads = leads.filter(l => groupIds.includes(l.id));\n      if (groupLeads.length < 2) return;\n      const winner = groupLeads.reduce((best, l) => (l.activity || []).length > (best.activity || []).length ? l : best, groupLeads[0]);\n      const removed = groupLeads.filter(l => l.id !== winner.id);\n      const mergedActivity = removed.flatMap(l => l.activity || []);\n      removedTotal += removed.length;\n      allRemovedIds.push(...removed.map(l => l.id));\n      leads = leads\n        .filter(l => !groupIds.includes(l.id) || l.id === winner.id)\n        .map(l => l.id === winner.id ? { ...l, activity: [...(l.activity || []), ...mergedActivity, { ts: new Date().toISOString(), text: `Merged ${removed.length} duplicate record${removed.length === 1 ? '' : 's'}` }] } : l);\n    });\n    const applyLocal = () => {\n      if (thi
